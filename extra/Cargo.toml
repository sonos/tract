[package]
name = "tract-extra"
version = "0.23.8-pre"
license = "MIT OR Apache-2.0"
authors = ["Mathieu Poumeyrol <kali@zoy.org>"]
description = "Tiny, no-nonsense, self contained, TensorFlow and ONNX inference"
repository = "https://github.com/snipsco/tract"
keywords = [ "TensorFlow", "NeuralNetworks" ]
categories = [ "science" ]
autobenches = false
edition = "2024"
rust-version.workspace = true

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
tract-nnef.workspace = true
tract-pulse = { workspace = true, optional = true }

[features]
default = ["pulse"]
# Pulsification of the crate's stateful ops, for the offline side of streaming.
# Enabled by default; runtime-only consumers drop tract-pulse with
# `default-features = false`.
pulse = ["dep:tract-pulse"]

[dev-dependencies]
criterion.workspace = true
env_logger.workspace = true
lazy_static.workspace = true
proptest.workspace = true
approx.workspace = true
