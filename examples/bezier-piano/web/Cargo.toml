[package]
name = "bezier-piano-web"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bezier-piano-native"
path = "src/bin/native.rs"

[dependencies]
anyhow.workspace = true
pollster.workspace = true
# The two MediaPipe hand models are TFLite flatbuffers; tract reads them as they are.
tract-core = { path = "../../../core" }
tract-tflite = { path = "../../../tflite" }
tract-gpu.workspace = true
tract-wgpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { workspace = true, features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
