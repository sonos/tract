[package]
name = "sd15-web"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sd15-native"
path = "src/bin/native.rs"

[dependencies]
anyhow.workspace = true
half.workspace = true
regex.workspace = true
serde_json.workspace = true
# Not the workspace's `tract`, which brings ONNX, pulse and gzip a browser build has no use for.
tract = { path = "../../../api/rs", default-features = false, features = [
  "transformers",
  "wgpu",
  "unstable-wgpu-async",
  "unstable-named-weights",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { workspace = true, features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
