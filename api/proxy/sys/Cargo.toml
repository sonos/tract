[package]
name = "tract-proxy-sys"
version = "0.23.11-pre"
license = "MIT OR Apache-2.0"
authors = ["Mathieu Poumeyrol <kali@zoy.org>"]
description = "Tiny, no-nonsense, self contained, TensorFlow and ONNX inference"
repository = "https://github.com/sonos/tract"
keywords = [ "NeuralNetworks" ]
categories = [ "science" ]
autobenches = false
edition = "2024"
rust-version.workspace = true
include = [ "/Cargo.toml", "/LICENSE*", "/src/**/*.rs", "/build.rs", "/tract.h" ]

[features]
# Declare the unstable numpy `.npy` / `.npz` functions (TRACT_UNSTABLE_NPYZ).
unstable-npyz = []

[build-dependencies]
bindgen = { version = "0.73.1", default-features = false, features = ["logging", "runtime"] }
