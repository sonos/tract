[package]
name = "tract-proxy"
version = "0.23.10-pre"
license = "MIT OR Apache-2.0"
authors = ["Mathieu Poumeyrol <kali@zoy.org>"]
description = "Tiny, no-nonsense, self contained, TensorFlow and ONNX inference"
repository = "https://github.com/sonos/tract"
keywords = [ "NeuralNetworks" ]
categories = [ "science" ]
autobenches = false
edition = "2024"
rust-version.workspace = true
include = [ "Cargo.toml", "src/**/*.rs", "LICENSE*" ]

[dependencies]
anyhow.workspace = true
boow.workspace = true
home.workspace = true
tract-api.workspace = true
tract-proxy-sys.workspace = true

[features]
# Reading and writing numpy `.npy` files and `.npz` archives. Unstable, see the `tract`
# crate feature of the same name. libtract must be built with it too.
unstable-npyz = ["tract-proxy-sys/unstable-npyz"]

[dev-dependencies]
half.workspace = true
ndarray.workspace = true
reqwest.workspace = true
rustls.workspace = true
tempfile.workspace = true
serde_json.workspace = true
