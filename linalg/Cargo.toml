[package]
name = "tract-linalg"
version = "0.23.6-pre"
license = "MIT OR Apache-2.0"
authors = ["Mathieu Poumeyrol <kali@zoy.org>"]
description = "Tiny, no-nonsense, self contained, TensorFlow and ONNX inference"
repository = "https://github.com/snipsco/tract"
keywords = ["TensorFlow", "NeuralNetworks"]
categories = ["science"]
autobenches = false
edition = "2024"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
byteorder.workspace = true
derive-new.workspace = true
downcast-rs.workspace = true
dyn-clone.workspace = true
dyn-eq.workspace = true
dyn-hash.workspace = true
inventory.workspace = true
lazy_static.workspace = true
log.workspace = true
num-traits.workspace = true
pastey.workspace = true
rayon = { workspace = true, optional = true }
scan_fmt.workspace = true
tract-data.workspace = true
# Enabled by the `test-kernels` feature only: the mmm kernel test bodies live in the lib so
# an out-of-lib harness can drive them.
env_logger = { workspace = true, optional = true }
nu-ansi-term = { workspace = true, optional = true }

[build-dependencies]
cc.workspace = true
half.workspace = true
minijinja.workspace = true
walkdir.workspace = true

[dev-dependencies]
# Self-dependency so the `mmm_kernels` harness target sees the kernel test bodies.
tract-linalg = { path = ".", features = ["test-kernels"] }
libtest-mimic.workspace = true
env_logger.workspace = true
libc.workspace = true
nu-ansi-term.workspace = true
core_affinity.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
proptest = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
# Wasm doesn't support the `fork` feature of proptest.
proptest = { version = "1.0.0", default-features = false, features = ["std", "bit-set"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[target.'cfg(target_family = "wasm")'.dev-dependencies]
# Wasm doesn't support the `rayon` feature of criterion
criterion = { version = "0.8", default-features = false, features = ["plotters", "cargo_bench_support"] }
# Wasm doesn't support the `fork` feature of proptest.
proptest = { version = "1.0.0", default-features = false, features = ["std", "bit-set"] }

[features]
# This feature is meant to accomodate very restrictive / legacy toolchains that do
# have support for fp16 instructions, breaking tract compilation.
# It is not meant to be used in other situations, where run-time detection is
# preferred.
no_fp16 = []
apple-amx-ios = []
# Compile the kernel trees of the other architectures too, so their routines can be
# enumerated from this host. They contribute nothing to a run: their asm is not assembled
# here and no pool draws from them. Off by default — a build for one target has no reason
# to carry three more trees.
foreign-inventory = []
# Compile the mmm kernel test bodies into the lib, for the `mmm_kernels` harness.
test-kernels = [ "dep:proptest", "dep:nu-ansi-term", "dep:env_logger" ]
default = [ ]
multithread-mm = [ "rayon" ]
complex = [ "tract-data/complex" ]
hwbench = [ "rayon" ]

[[test]]
name = "mmm_kernels"
harness = false

