name: Python gh-pages doc

on:
  pull_request:
  # Only "published": an untyped release trigger fires once per release action
  # (created, published, released), and those parallel runs raced on the
  # gh-pages push.
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: false

permissions:
  contents: read

jobs:
  build_doc:
    name: Build doc
    runs-on: ubuntu-24.04
    if: github.repository == 'sonos/tract'
    permissions:
      contents: write
    # Deploys push to gh-pages: serialise them (never cancel a deploy midway).
    # PR runs only build, so they get their own per-ref group.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pydoc-{0}', github.ref) || 'gh-pages-deploy' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head, not GitHub's refs/pull/N/merge: that merge exists nowhere else
          # and goes stale when main moves.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Extract version tag
        id: version
        if: github.event_name == 'release' && github.event.action == 'published'
        run: echo value=$(echo ${GITHUB_REF} | cut -f 3 -d / | sed 's/^v//' ) >> $GITHUB_OUTPUT

      - name: Build doc
        run: |
          set -ex
          cd api/py
          python -m venv pydocs
          source pydocs/bin/activate
          pip install -r requirements-docs.txt
          pip install -e .
          sphinx-build -b html . _build/html
          cp _static/redirect-index.html _build/html/index.html

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          set -ex
          git config user.name "CI bot"
          git config user.email ci-bot@tract.rs

          # A release publishes its versioned docs and refreshes dev in the
          # same commit; other triggers only refresh dev.
          version="${STEPS_VERSION_OUTPUTS_VALUE}"
          targets="dev"
          if [ -n "$version" ]; then
            targets="$version dev"
          else
            version="dev"
          fi

          # fetch existing gh-pages into a work directory
          git fetch origin gh-pages --depth=1 || true
          workdir=$(mktemp -d)
          git worktree add "$workdir" gh-pages 2>/dev/null || {
            git worktree add --orphan "$workdir" gh-pages
          }

          # copy new build into the versioned subdirectories
          for target in $targets; do
            rm -rf "$workdir/$target"
            cp -r api/py/_build/html "$workdir/$target"
          done

          # regenerate versions.json (mike-compatible format) from directories present
          cd "$workdir"
          python3 -c "
          import json, os, re
          dirs = sorted(
              [d for d in os.listdir('.') if os.path.isdir(d) and d not in ('.git', 'bench')],
              key=lambda v: [int(x) if x.isdigit() else x for x in re.split(r'(\d+)', v)],
              reverse=True,
          )
          versions = [{'version': d, 'title': d, 'aliases': []} for d in dirs]
          with open('versions.json', 'w') as f:
              json.dump(versions, f, indent=2)
          "

          # commit and push. actions/checkout ran with persist-credentials:
          # false, so no auth is wired into .git/config — push via an
          # explicit token URL instead.
          git add -A
          git commit -m "Update Python docs ($version)" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

          # clean up worktree
          cd -
          git worktree remove "$workdir"
        env:
          STEPS_VERSION_OUTPUTS_VALUE: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
