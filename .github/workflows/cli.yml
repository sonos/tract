name: CLI

# Build the tract CLI once per platform on GitHub-hosted runners, then everything that
# runs it:
# - harness cases: every harness/*/ci.sh, plus every ci-full.sh off PRs, each on the
#   runners its `# ci-runners:` line names (ubuntu-24.04 when it has none);
# - the LLM matrix (off PRs);
# - the bench suite on the self-hosted bench machines, which either (nightly) appends
#   one row per run to the bench-data branch, or (PR) compares against that reference
#   and posts a single fan-in comment, plus the nightly kernel-pick and smoke gates.
# The Jetson (aarch64 + CUDA 12) can't be built on a hosted runner natively, so it
# reuses cross.sh's debian-stretch cross-build.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to run on (from fork ok). Leave empty to run on selected branch."
        required: false
        type: number
      mt_ladder:
        description: "Thread-count ladder (comma list, 0=physical cores) for a scaling run; empty = normal vs-main bench."
        required: false
        type: string
        default: ''
      scope:
        description: "full: the nightly-sized run (LLM matrix, ci-full.sh cases, harness-checked). bench: what a PR push runs. wgpu, wasm: that bench leg alone, reported on the PR (needs pr_number)."
        required: false
        type: choice
        options: [ full, bench, wgpu, wasm ]
        default: full
      rebench:
        description: "Re-run only the runs the PR's last bench report flagged red, on the boxes that flagged them (needs pr_number)."
        required: false
        type: boolean
        default: false
      select:
        description: "Comma-separated bench-name globs (bench-suite --select): bench only those, nightly-only ones included; empty = the whole manifest."
        required: false
        type: string
        default: ''
      comment_id:
        description: "The /ci command comment to report on (set by ci-command.yml)."
        required: false
        type: string
        default: ''
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - '.github/**'

permissions:
  contents: read

concurrency:
  # A push to a PR cancels the run of its previous push. Every other run, a /ci command
  # included, keys on its own run id: commands on a PR neither cancel each other nor are
  # cancelled by a push (a run whose head moved on reports that instead of its numbers).
  group: cli-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write       # pending "/ci cli" status on a dispatched PR run
      pull-requests: write  # marks the /ci command comment running
      actions: read         # a rebench reads the previous report's state artifact
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      ref: ${{ steps.gate.outputs.ref }}
      day: ${{ steps.gate.outputs.day }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      is_pr: ${{ steps.gate.outputs.is_pr }}
      full: ${{ steps.gate.outputs.full }}
      tests: ${{ steps.gate.outputs.tests }}
      kind: ${{ steps.gate.outputs.kind }}
      same_repo: ${{ steps.gate.outputs.same_repo }}
      mt_ladder: ${{ steps.gate.outputs.mt_ladder }}
      cases: ${{ steps.cases.outputs.cases }}
      boxes: ${{ steps.rebench.outputs.boxes || steps.boxes.outputs.boxes }}
      boxes_apple: ${{ steps.split.outputs.apple }}
      boxes_linux: ${{ steps.split.outputs.linux }}
      builds: ${{ steps.scoped.outputs.builds }}
      build_macos: ${{ steps.scoped.outputs.build_macos }}
      dinghy_builds: ${{ steps.scoped.outputs.dinghy_builds }}
      dinghy_devices: ${{ steps.scoped.outputs.dinghy_devices }}
      unaffected: ${{ steps.scoped.outputs.unaffected }}
      bench_none: ${{ steps.scoped.outputs.bench_none }}
      macos_host: ${{ steps.split.outputs.macos_host }}
      rebench: ${{ steps.gate.outputs.rebench }}
      only: ${{ steps.rebench.outputs.only || '{}' }}
      previous: ${{ steps.rebench.outputs.previous }}
      bins_run: ${{ steps.bins.outputs.bins_run }}
      dinghy: ${{ steps.rebench.outputs.dinghy || 'true' }}
    steps:
      # The self-hosted bench boxes, minus the targets listed (space-separated) in the
      # BENCH_DISABLED_BOXES repo variable: a box that is down would otherwise leave its
      # legs queued, holding the PR report back until GitHub times them out.
      # suite_args: the Orin is GPU-only, its arm64 CPU is redundant with apple-m1-max.
      - id: boxes
        env:
          DISABLED: ${{ vars.BENCH_DISABLED_BOXES }}
          SCOPE: ${{ github.event.inputs.scope }}
        run: |
          if [ "$SCOPE" = wgpu ] || [ "$SCOPE" = wasm ]; then
            echo "boxes=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          boxes=$(jq -c --arg disabled "$DISABLED" \
            '($disabled | split(" ") | map(select(. != ""))) as $off | map(select(.target | IN($off[]) | not))' <<'EOF'
          [
            { "target": "apple-m1-max", "runner": "bench-apple-m1-max", "triple": "aarch64-apple-darwin" },
            { "target": "i9-11900kb_rtx-4060", "runner": "bench-i9-11900kb-rtx-4060", "triple": "x86_64-unknown-linux-gnu" },
            { "target": "i9-9900k", "runner": "i99900k", "triple": "x86_64-unknown-linux-gnu" },
            { "target": "jetson-orin-nx", "runner": "orin-nx-16g", "triple": "aarch64-unknown-linux-gnu-stretch",
              "suite_args": "--skip-cpu" }
          ]
          EOF
          )
          for off in $DISABLED; do echo "::notice::bench box $off disabled via BENCH_DISABLED_BOXES"; done
          echo "boxes=$boxes" >> "$GITHUB_OUTPUT"
      # A pull_request run's sha is the PR's own code, and it has no /ci command to report on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' }}
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          path: .ci-scripts
          persist-credentials: false
      # Resolves this run's target ref and whether it should behave like a PR run
      # (compare + comment) or a reference run (append to bench-data): a manual
      # `/ci bench` dispatch on a PR must be treated as a PR run even though its
      # event_name is workflow_dispatch, or its numbers would get pushed to
      # bench-data as if it were a nightly/main reference point.
      - id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BENCH_ENABLED: ${{ vars.BENCH_ENABLED }}
        with:
          script: |
            if (process.env.BENCH_ENABLED === 'false') {
              core.notice('bench disabled via BENCH_ENABLED repo variable');
              core.setOutput('enabled', 'false');
            } else {
              core.setOutput('enabled', 'true');
            }
            core.setOutput('day', new Date().toISOString().slice(0, 10));
            // Set on any event; a pull_request trigger has no inputs, so it stays empty
            // (normal vs-main bench). Only a workflow_dispatch can request a scaling run.
            core.setOutput('mt_ladder', context.payload.inputs?.mt_ladder || '');
            const rebench = String(context.payload.inputs?.rebench) === 'true';
            if (rebench && !context.payload.inputs?.pr_number) {
              core.setFailed('rebench needs a pr_number');
              return;
            }
            core.setOutput('rebench', String(rebench));
            // native: the bench boxes' own suite. wgpu, wasm: that one leg, on a PR only.
            const scope = context.payload.inputs?.scope || 'full';
            const kind = ['wgpu', 'wasm'].includes(scope) ? scope : 'native';
            if (kind !== 'native' && !context.payload.inputs?.pr_number) {
              core.setFailed(`scope ${scope} needs a pr_number`);
              return;
            }
            core.setOutput('kind', kind);
            // The LLM matrix, ci-full.sh cases and harness-checked: off on a PR push and
            // on a dispatch with scope `bench` (`/ci bench`), on otherwise.
            core.setOutput('full', String(context.eventName !== 'pull_request' && scope === 'full'));
            // The harness cases: on a push, the nightly and a full-scope dispatch (`/ci cli`).
            // A `/ci bench` of any kind only benches; its head's push run already tested it.
            const tests = kind === 'native' && !rebench && (context.eventName !== 'workflow_dispatch' || scope === 'full');
            core.setOutput('tests', String(tests));

            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              core.setOutput('is_pr', 'true');
              core.setOutput('pr_number', String(pr.number));
              core.setOutput('same_repo', String(pr.head.repo.full_name === baseRepo));
              core.setOutput('ref', pr.head.sha);
              return;
            }
            const prInput = context.payload.inputs?.pr_number;
            if (!prInput) {
              core.setOutput('is_pr', 'false');
              core.setOutput('pr_number', '');
              core.setOutput('same_repo', 'true');
              core.setOutput('ref', process.env.GITHUB_SHA);
              return;
            }
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(prInput),
            });
            core.setOutput('is_pr', 'true');
            core.setOutput('pr_number', String(prInput));
            core.setOutput('same_repo', String(pr.data.head.repo.full_name === baseRepo));
            core.setOutput('ref', pr.data.head.sha);
            const ci = require(`${process.env.GITHUB_WORKSPACE}/.ci-scripts/.github/scripts/ci-feedback.js`);
            await ci.update(github, context, { commentId: context.payload.inputs?.comment_id, state: 'running' });
            // A run without tests does not speak for "/ci cli".
            if (tests) {
              await ci.status(github, context, { sha: pr.data.head.sha, target: 'cli', state: 'pending', description: 'Running' });
            }
            // A /ci command's benches: pending until finish, then green whatever they found.
            if (context.payload.inputs?.comment_id && process.env.BENCH_ENABLED !== 'false') {
              const target = kind === 'native' ? 'bench' : `bench ${kind}`;
              await ci.status(github, context, { sha: pr.data.head.sha, target, state: 'pending', description: 'Running' });
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.ref }}
          persist-credentials: false
      # One test leg per (case, runner): a case is a harness/*/ci.sh, plus on a full run a
      # harness/*/ci-full.sh, run on every runner its `# ci-runners:` line names.
      - id: cases
        env:
          FULL: ${{ steps.gate.outputs.full }}
        run: |
          names="-name ci.sh"
          if [ "$FULL" = true ]; then names="$names -o -name ci-full.sh"; fi
          cases=$(find harness \( $names \) | sort | while read -r script
          do
            runners=$(sed -n 's/^# ci-runners: *//p' "$script" | head -1)
            for runner in ${runners:-ubuntu-24.04}
            do
              case "$runner" in
                ubuntu-24.04|cuda-tests|bench-i9-11900kb-rtx-4060) triple=x86_64-unknown-linux-gnu ;;
                macos-latest|metal-tests|bench-apple-m1-max) triple=aarch64-apple-darwin ;;
                *) echo "::error file=$script::no CLI build for runner $runner" >&2; exit 1 ;;
              esac
              jq -nc --arg script "$script" --arg runner "$runner" --arg triple "$triple" '$ARGS.named'
            done
          done | jq -sc .)
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
      # A rebench re-runs, on the boxes that flagged them, only the runs the last report on
      # this head flagged red. That report left its per-device results and reds behind in a
      # bench-state-<sha> artifact; a head with none (never benched, or moved since) refuses.
      # Its candidate binaries are those that report measured, from the run that built them
      # (named in the state by an earlier rebench, else the run that left the state).
      - id: rebench
        if: steps.gate.outputs.rebench == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.gate.outputs.ref }}
          BOXES: ${{ steps.boxes.outputs.boxes }}
        run: |
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bench-state-$SHA" \
            --jq '[.artifacts[] | select(.expired | not)][0] // empty')
          id=$(jq -r '.id // empty' <<<"$artifact")
          if [ -z "$id" ]; then
            echo "::error::no bench report on ${SHA:0:9} to rebench; run /ci bench first"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > state.zip
          unzip -q state.zip -d state
          bins_run=$(cat state/bins-run 2>/dev/null || jq -r '.workflow_run.id' <<<"$artifact")
          only=$(jq -c 'map_values(join(","))' state/reds.json)
          [ "$only" = '{}' ] && echo "::notice::the last report on ${SHA:0:9} has no reds; nothing to rebench"
          boxes=$(jq -c --argjson only "$only" 'map(select(.target | in($only)) + {only: $only[.target]})' <<<"$BOXES")
          dinghy=$(jq -r --argjson boxes "$BOXES" '(keys - ($boxes | map(.target))) | length > 0' <<<"$only")
          {
            echo "previous=$id"
            echo "bins_run=$bins_run"
            echo "only=$only"
            echo "boxes=$boxes"
            echo "dinghy=$dinghy"
          } >> "$GITHUB_OUTPUT"
      # A dispatched PR run benches and tests the binaries of an earlier run on the same head
      # (for a rebench, those its bench state measured) instead of building them again, if
      # that run built them with this repo's own workflow (a dispatch, or a pull_request from
      # a branch of this repo, never one from a fork) and still has every tract-cli artifact
      # a native run downloads. Otherwise bins_run stays empty and the builds run.
      - id: bins
        if: steps.gate.outputs.is_pr == 'true' && github.event_name == 'workflow_dispatch' && steps.gate.outputs.kind == 'native'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.gate.outputs.ref }}
          CANDIDATE: ${{ steps.rebench.outputs.bins_run }}
          NEEDED: >-
            tract-cli-x86_64-unknown-linux-gnu
            tract-cli-aarch64-unknown-linux-gnu-stretch
            tract-cli-aarch64-apple-darwin
            tract-cli-aarch64-unknown-linux-gnu-stretch-dinghy
            tract-cli-armv7-unknown-linux-gnueabihf-stretch-dinghy
            tract-cli-riscv64gc-unknown-linux-musl-dinghy
        run: |
          candidates=$CANDIDATE
          if [ -z "$candidates" ]; then
            candidates=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cli.yml/runs?head_sha=$SHA&per_page=20" \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id")
          fi
          for run in $candidates; do
            trusted=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
              --jq '.event != "pull_request" or .head_repository.full_name == .repository.full_name')
            [ "$trusted" = true ] || continue
            have=" $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired | not) | .name] | join(" ")') "
            complete=true
            for name in $NEEDED; do
              case "$have" in *" $name "*) ;; *) complete=false ;; esac
            done
            if [ "$complete" = true ]; then
              echo "::notice::benching the binaries of run $run"
              echo "bins_run=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::notice::no earlier run on ${SHA:0:9} to take binaries from; building them"
      # On a PR push, ci/affected.py names the bench legs this change cannot affect; they and
      # the builds only they consume are left out. Dispatches (any `/ci` command), the nightly,
      # a `ci:full` label and CI_SCOPING=off run everything, and so does any failure here.
      - id: changed
        if: github.event_name == 'pull_request' && vars.CI_SCOPING != 'off' && !contains(github.event.pull_request.labels.*.name, 'ci:full')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.gate.outputs.pr_number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          # The files API lists at most 3000; past that, let everything run.
          if [ "$(wc -l < "$RUNNER_TEMP/changed.txt")" -ge 3000 ]; then echo Cargo.lock >> "$RUNNER_TEMP/changed.txt"; fi
          echo "files=$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT"
      - id: scope
        if: steps.changed.outputs.files != ''
        continue-on-error: true
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          python3 ci/affected.py --files "$FILES" --json "$RUNNER_TEMP/scope.json" --summary "$GITHUB_STEP_SUMMARY"
          echo "skip=$(jq -c '[.legs[] | select(.workflow == "cli.yml" and (.affected | not)) | .leg]' "$RUNNER_TEMP/scope.json")" >> "$GITHUB_OUTPUT"
      # The apple boxes bench as soon as build-macos is done, the others as soon as build is.
      # build-macos runs on a self-hosted Mac unless the apple box is disabled, on a hosted
      # runner then.
      - id: split
        env:
          BOXES: ${{ steps.rebench.outputs.boxes || steps.boxes.outputs.boxes }}
          ENABLED: ${{ steps.boxes.outputs.boxes }}
          SKIP: ${{ steps.scope.outputs.skip || '[]' }}
        run: |
          BOXES=$(jq -c --argjson skip "$SKIP" 'map(select(("bench " + .target) | IN($skip[]) | not))' <<<"$BOXES")
          echo "apple=$(jq -c 'map(select(.triple == "aarch64-apple-darwin"))' <<<"$BOXES")" >> "$GITHUB_OUTPUT"
          echo "linux=$(jq -c 'map(select(.triple != "aarch64-apple-darwin"))' <<<"$BOXES")" >> "$GITHUB_OUTPUT"
          echo "macos_host=$(jq -r 'if any(.[]; .runner == "bench-apple-m1-max") then "metal-tests" else "macos-latest" end' <<<"$ENABLED")" >> "$GITHUB_OUTPUT"
      # The builds, keeping only those a remaining bench or harness leg downloads. The x86_64
      # CLI always builds: the report renders with it. ci/affected.py mirrors these legs.
      - id: scoped
        env:
          SKIP: ${{ steps.scope.outputs.skip || '[]' }}
          SCOPED: ${{ steps.scope.outputs.skip != '' }}
          LINUX: ${{ steps.split.outputs.linux }}
          APPLE: ${{ steps.split.outputs.apple }}
          CASES: ${{ steps.cases.outputs.cases }}
        run: |
          builds=$(jq -c --argjson linux "$LINUX" \
            'map(select(.triple == "x86_64-unknown-linux-gnu" or (.triple | IN($linux[].triple))))' <<'EOF'
          [
            { "triple": "x86_64-unknown-linux-gnu", "host": "ubuntu-24.04",
              "build": "ROOT=. ./ci/ci-system-setup.sh && cargo build -p tract-cli --release --features bench-suite",
              "bin": "target/release/tract" },
            { "triple": "aarch64-unknown-linux-gnu-stretch", "host": "ubuntu-24.04",
              "build": "TRACT_CROSS_BUILD_CLI=1 CARGO_TARGET_DIR=.cross-cache/target PLATFORM=aarch64-unknown-linux-gnu-stretch ./ci/cross.sh",
              "bin": ".cross-cache/target/aarch64-unknown-linux-gnu/release/tract" }
          ]
          EOF
          )
          build_macos=$(jq -r --argjson apple "$APPLE" --arg scoped "$SCOPED" \
            '$scoped != "true" or ($apple | length > 0) or any(.[]; .triple == "aarch64-apple-darwin")' <<<"$CASES")
          devices=$(jq -c --argjson skip "$SKIP" 'map(select(("bench " + .device) | IN($skip[]) | not))' <<'EOF'
          [
            { "device": "cortex-a55", "triple": "aarch64-unknown-linux-gnu-stretch",
              "runner": "dinghy-sidekick-a55", "dinghy_target": "dinghy-a55" },
            { "device": "cortex-a53", "triple": "aarch64-unknown-linux-gnu-stretch",
              "runner": "dinghy-sidekick-a53", "dinghy_target": "dinghy-a53" },
            { "device": "cortex-a7", "triple": "armv7-unknown-linux-gnueabihf-stretch",
              "runner": "dinghy-sidekick-a7", "dinghy_target": "dinghy-a7" },
            { "device": "cortex-a9", "triple": "armv7-unknown-linux-gnueabihf-stretch",
              "runner": "dinghy-sidekick-a9", "dinghy_target": "dinghy-a9" },
            { "device": "beaglev-ahead", "triple": "riscv64gc-unknown-linux-musl",
              "runner": "dinghy-sidekick-rv-beaglev", "dinghy_target": "dinghy-rv-beaglev" },
            { "device": "orangepi-rv2", "triple": "riscv64gc-unknown-linux-musl",
              "runner": "dinghy-sidekick-rv-rv2", "dinghy_target": "dinghy-rv-rv2" }
          ]
          EOF
          )
          # RISC-V boards run a fully-static musl CLI (built directly by cross.sh, no stretch
          # container); one self-tuning build serves every rv64gc board. The RVV kernels are
          # picked at runtime off the hart's VLEN, so this same binary runs them on an RVV 1.0
          # board and the generic scalar path where the vector unit is absent or the 0.7.1 draft.
          dinghy_builds=$(jq -c --argjson devices "$devices" 'map(select(.triple | IN($devices[].triple)))' <<'EOF'
          [
            { "triple": "aarch64-unknown-linux-gnu-stretch", "rustc_triple": "aarch64-unknown-linux-gnu" },
            { "triple": "armv7-unknown-linux-gnueabihf-stretch", "rustc_triple": "armv7-unknown-linux-gnueabihf" },
            { "triple": "riscv64gc-unknown-linux-musl", "rustc_triple": "riscv64gc-unknown-linux-musl" }
          ]
          EOF
          )
          unaffected=$(jq -r '[.[] | select(startswith("bench ")) | ltrimstr("bench ")] | join(", ")' <<<"$SKIP")
          bench_none=$(jq -nr --argjson linux "$LINUX" --argjson apple "$APPLE" --argjson devices "$devices" \
            '($linux + $apple + $devices) | length == 0')
          {
            echo "builds=$builds"
            echo "build_macos=$build_macos"
            echo "dinghy_devices=$devices"
            echo "dinghy_builds=$dinghy_builds"
            echo "unaffected=$unaffected"
            echo "bench_none=$bench_none"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.triple }}
    needs: prepare
    if: needs.prepare.outputs.bins_run == ''
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read      # pull the prebuilt cross-build image (ghcr, private)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # per-PR build on the developer feedback path; PR runs restore but only main saves.
          # The stretch leg cross-builds in a debian-stretch container into .cross-cache/target
          # (CARGO_TARGET_DIR); cache that verbatim so the container's aarch64 artifacts survive —
          # rust-cache's own target/ cleanup is host-target-only and would drop them. The container
          # also bind-mounts the host cargo registry (see cross.sh) so crate downloads persist.
          # -gpu: keep the cuda build's cache off the bare-triple key the no-cuda builds share.
          key: ${{ matrix.triple }}-gpu
          cache-directories: .cross-cache/target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ${{ matrix.build }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # ghcr login for the cross-build image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tract-cli-${{ matrix.triple }}
          path: ${{ matrix.bin }}

  # On a self-hosted Mac, a cold build is faster than a cached one on a hosted runner.
  build-macos:
    needs: prepare
    if: needs.prepare.outputs.kind == 'native' && needs.prepare.outputs.bins_run == '' && needs.prepare.outputs.build_macos == 'true'
    runs-on: ${{ needs.prepare.outputs.macos_host }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - run: ROOT=. ./ci/ci-system-setup.sh && cargo build -p tract-cli --release --features bench-suite
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tract-cli-aarch64-apple-darwin
          path: target/release/tract

  test:
    name: ${{ matrix.script }} / ${{ matrix.runner }}
    needs: [ prepare, build, build-macos ]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.tests == 'true' && (needs.prepare.outputs.bins_run != '' || (needs.build.result == 'success' && (needs.build-macos.result == 'success' || needs.prepare.outputs.build_macos != 'true'))) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      LARGE_MODELS: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.cases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tract-cli-${{ matrix.triple }}
          path: tract-cli
          run-id: ${{ needs.prepare.outputs.bins_run }}
          github-token: ${{ needs.prepare.outputs.bins_run && github.token || '' }}
      - name: Run case
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          chmod +x tract-cli/tract
          export TRACT_RUN="$GITHUB_WORKSPACE/tract-cli/tract"
          "./$SCRIPT"

  # The harness cases again on a CLI built with debug and paranoid assertions, which
  # check graph invariants the release build skips. cli-models is left out: the
  # paranoid checks are too slow on its models.
  harness-checked:
    needs: prepare
    if: needs.prepare.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false # restore-only: nightly job, never save (would evict the per-PR caches under the 10 GB cap)
      - name: Build and run cases
        run: |
          ROOT=. ./ci/ci-system-setup.sh
          cargo build -p tract-cli --profile opt-test --features tract-core/paranoid_assertions
          export TRACT_RUN="$GITHUB_WORKSPACE/target/opt-test/tract"
          for script in $(find harness -name ci.sh ! -path harness/cli-models/ci.sh | sort)
          do
            "./$script"
          done

  llm-combos:
    needs: prepare
    if: needs.prepare.outputs.full == 'true'
    runs-on: ubuntu-24.04
    outputs:
      combos: ${{ steps.set-matrix.outputs.combos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - id: set-matrix
        run: |
          combos=$(awk -F'\t' 'BEGIN{printf "["} /^#/||NF<3{next} {n=split($3,qs,","); for(i=1;i<=n;i++){printf "%s{\"model\":\"%s\",\"q\":\"%s\"}", (c++?",":""), $1, qs[i]}} END{print "]"}' ci/llm-models.tsv)
          echo "combos=$combos" >> $GITHUB_OUTPUT

  llm:
    name: ${{ matrix.os }} / ${{ matrix.rt }} / ${{ matrix.combo.model }} / ${{ matrix.combo.q }}
    needs: [ prepare, build, build-macos, llm-combos ]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.llm-combos.result == 'success' && (needs.prepare.outputs.bins_run != '' || (needs.build.result == 'success' && needs.build-macos.result == 'success')) }}
    runs-on: ${{ matrix.os }}
    env:
      LARGE_MODELS: true
    strategy:
      fail-fast: false
      matrix:
        os: [ bench-apple-m1-max, bench-i9-11900kb-rtx-4060 ]
        rt: [ cpu, gpu ]
        combo: ${{ fromJson(needs.llm-combos.outputs.combos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tract-cli-${{ matrix.os == 'bench-apple-m1-max' && 'aarch64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}
          path: tract-cli
          run-id: ${{ needs.prepare.outputs.bins_run }}
          github-token: ${{ needs.prepare.outputs.bins_run && github.token || '' }}
      - name: Download and run
        env:
          RT_MATRIX: ${{ matrix.rt }}
          MODEL: ${{ matrix.combo.model }}
          Q: ${{ matrix.combo.q }}
        run: |
          chmod +x tract-cli/tract
          export TRACT_RUN="$GITHUB_WORKSPACE/tract-cli/tract"
          ci/test-llm.sh "$MODEL" "$Q" "$RT_MATRIX"

  # A pull_request run shows each leg as a check; a `/ci` dispatch on a PR reports
  # back through the "/ci cli" commit status and the tests section of its command comment.
  report-tests:
    name: Report tests to PR
    needs: [ prepare, build, build-macos, test, harness-checked, llm-combos, llm ]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.prepare.outputs.pr_number != '' && needs.prepare.outputs.tests == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          path: .ci-scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          HEAD_SHA: ${{ needs.prepare.outputs.ref }}
          COMMENT_ID: ${{ github.event.inputs.comment_id }}
        with:
          script: |
            const ci = require(`${process.env.GITHUB_WORKSPACE}/.ci-scripts/.github/scripts/ci-feedback.js`);
            const sha = process.env.HEAD_SHA;
            const result = ci.jobs(process.env.NEEDS);
            await ci.status(github, context, {
              sha, target: 'cli', state: result.state,
              description: { success: 'All jobs passed', cancelled: 'Cancelled' }[result.state] || `${result.failed.length} job(s) failed`,
            });
            await ci.update(github, context, {
              commentId: process.env.COMMENT_ID,
              issueNumber: process.env.PR_NUMBER,
              fallbackHeader: `**CLI tests** · head \`${sha.slice(0, 9)}\``,
              state: process.env.COMMENT_ID ? undefined : result.state,
              sections: { tests: result.text },
            });

  bench:
    name: bench ${{ matrix.target }}
    needs: [ prepare, build ]
    # Skipped builds mean prepare found the binaries of an earlier run (bins_run).
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.prepare.outputs.bins_run != '') && needs.prepare.outputs.enabled == 'true' && needs.prepare.outputs.boxes_linux != '[]' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write     # push to bench-data (nightly only)
      actions: read       # may download the binaries of an earlier run
    # No concurrency group: each box is a single self-hosted agent, so the agent
    # serialises bench/hwbench/smoke itself (queues, never cancels). A shared
    # group would instead cancel one PR's queued bench when another PR's lands.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.boxes_linux) }}
    steps: &bench-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tract-cli-${{ matrix.triple }}
          path: tract-cli
          run-id: ${{ needs.prepare.outputs.bins_run }}
          github-token: ${{ needs.prepare.outputs.bins_run && github.token || '' }}
      # Read-only bench-data checkout: the orchestrator builds this device's retry
      # expectations from it inline (no separate job, no Python on the runner).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bench-data
          path: bench-ref
          fetch-depth: 1
          persist-credentials: false
      # Every Metal process loads the whole compiler-cache index at startup, so a cache grown
      # by earlier jobs inflates load time and RSS. Start each bench from an empty cache.
      - name: Reset the Metal compiler cache
        if: runner.os == 'macOS'
        run: rm -rf "$(getconf DARWIN_USER_CACHE_DIR)com.apple.metal"
      - name: Run bench suite
        env:
          TRIPLE: ${{ matrix.triple }}
          DEVICE: ${{ matrix.target }}
          MT_LADDER: ${{ needs.prepare.outputs.mt_ladder }}
          ONLY: ${{ matrix.only }}
          SELECT: ${{ github.event.inputs.select }}
        run: |
          chmod +x tract-cli/tract
          tract-cli/tract bench-suite \
            --manifest ci/benches.toml \
            ${ONLY:+--only "$ONLY"} \
            ${SELECT:+--select "$SELECT"} \
            --bench-data bench-ref \
            --thresholds ci/bench-thresholds.toml \
            --triple "$TRIPLE" --device "$DEVICE" \
            ${MT_LADDER:+--threads-ladder "$MT_LADDER"} \
            ${{ needs.prepare.outputs.is_pr != 'true' && '--samples 5 --second-pass-max 10' || '' }} \
            ${{ matrix.suite_args }}        # produces ./metrics

      # A failed bench run fails the suite after it wrote the others' metrics; the steps below
      # still record or report those, and the job stays failed.
      # --- nightly / dispatch: append the row to bench-data ---
      - name: Checkout bench-data
        if: ${{ !cancelled() && hashFiles('metrics') != '' && needs.prepare.outputs.is_pr != 'true' }}
        # zizmor: ignore[artipacked] credentials are needed to push the row back to
        # bench-data; this checkout is never uploaded as an artifact.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bench-data
          path: bench-data
          fetch-depth: 1
      - name: Append and push
        if: ${{ !cancelled() && hashFiles('metrics') != '' && needs.prepare.outputs.is_pr != 'true' }}
        env:
          DEVICE: ${{ matrix.target }}
          TRIPLE: ${{ matrix.triple }}
          REF: ${{ needs.prepare.outputs.ref }}
          DAY: ${{ needs.prepare.outputs.day }}
        run: |
          tract-cli/tract bench-append --metrics metrics --out bench-data \
            --triple "$TRIPLE" --device "$DEVICE" --day "$DAY" --commit "$REF"
          cd bench-data
          git config user.name "tract-ci"
          git config user.email "tract-ci@users.noreply.github.com"
          git add -A
          git commit -m "bench: $DEVICE $DAY ${REF:0:9}"
          for i in 1 2 3 4 5; do
            git push origin HEAD:bench-data && exit 0
            git fetch origin bench-data
            git rebase origin/bench-data || git rebase --abort
          done
          echo "push failed after retries" >&2; exit 1

      # --- PR: emit this device's result for the fan-in report job ---
      - name: Stage PR result
        if: ${{ !cancelled() && hashFiles('metrics') != '' && needs.prepare.outputs.is_pr == 'true' }}
        env:
          DEVICE: ${{ matrix.target }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          mkdir -p result
          cp metrics result/metrics
          if [ -f metrics.failures ]; then cp metrics.failures result/; fi
          printf '{"device":"%s","triple":"%s"}\n' "$DEVICE" "$TRIPLE" > result/meta.json
      - name: Upload PR result
        if: ${{ !cancelled() && hashFiles('metrics') != '' && needs.prepare.outputs.is_pr == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-result-${{ matrix.target }}
          path: result

  bench-macos:
    name: bench ${{ matrix.target }}
    needs: [ prepare, build-macos ]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build-macos.result == 'success' || needs.prepare.outputs.bins_run != '') && needs.prepare.outputs.enabled == 'true' && needs.prepare.outputs.boxes_apple != '[]' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write     # push to bench-data (nightly only)
      actions: read       # may download the binaries of an earlier run
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.boxes_apple) }}
    steps: *bench-steps

  # --- `/ci bench wgpu`: ci/benches-wgpu.toml on the 4060 box over Vulkan, against the
  # nightly wgpu series (bench-wgpu.yml). Its own build: the wgpu runtime stays out of the
  # binary the other boxes bench.
  build-wgpu:
    needs: prepare
    if: ${{ needs.prepare.outputs.enabled == 'true' && needs.prepare.outputs.kind == 'wgpu' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-gnu-wgpu
          save-if: false
      - run: ROOT=. ./ci/ci-system-setup.sh && cargo build -p tract-cli --release --features bench-suite,wgpu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tract-cli-wgpu
          path: target/release/tract

  bench-wgpu:
    needs: [ prepare, build-wgpu ]
    if: ${{ needs.prepare.outputs.enabled == 'true' && needs.prepare.outputs.kind == 'wgpu' }}
    runs-on: bench-i9-11900kb-rtx-4060
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tract-cli-wgpu
          path: tract-cli
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bench-data
          path: bench-ref
          fetch-depth: 1
          persist-credentials: false
      - name: Check the Vulkan adapter is the NVIDIA GPU
        run: vulkaninfo --summary | grep -q "driverName *= NVIDIA"
      - name: Run bench suite
        env:
          SELECT: ${{ github.event.inputs.select }}
        run: |
          chmod +x tract-cli/tract
          tract-cli/tract bench-suite \
            --manifest ci/benches-wgpu.toml \
            ${SELECT:+--select "$SELECT"} \
            --bench-data bench-ref \
            --thresholds ci/bench-thresholds.toml \
            --triple x86_64-unknown-linux-gnu --device i9-11900kb_rtx-4060_wgpu
      - name: Stage PR result
        if: ${{ !cancelled() && hashFiles('metrics') != '' }}
        run: |
          mkdir -p result
          cp metrics result/metrics
          if [ -f metrics.failures ]; then cp metrics.failures result/; fi
          printf '{"device":"i9-11900kb_rtx-4060_wgpu","triple":"x86_64-unknown-linux-gnu"}\n' > result/meta.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('metrics') != '' }}
        with:
          name: bench-result-i9-11900kb_rtx-4060_wgpu
          path: result

  # --- dinghy target fleet (kill switch: BENCH_DINGHY_ENABLED=false). ---
  # A sidekick runner cross-runs the CLI on each target over dinghy's ssh transport; per-target
  # config lives in the sidekick's .dinghy.toml. On by default; opt-out only, so fork PRs (which
  # don't inherit the repo variable) still run the ARM boards.

  build-dinghy:
    name: build ${{ matrix.triple }} (dinghy)
    needs: prepare
    if: ${{ needs.prepare.outputs.enabled == 'true' && vars.BENCH_DINGHY_ENABLED != 'false' && needs.prepare.outputs.dinghy == 'true' && needs.prepare.outputs.kind == 'native' && needs.prepare.outputs.bins_run == '' && needs.prepare.outputs.dinghy_builds != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read      # pull the prebuilt cross-build image (ghcr, private)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.dinghy_builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.triple }}
          cache-directories: .cross-cache/target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # glibc-stretch CLI for the board (matches the production devices), cross-built in the
      # debian-stretch container: bench-suite on, cuda/tflite off; SKIP_QEMU_TEST builds only.
      # TRACT_CLI_FEATURES suppresses the stretch leg's default cuda forcing (see cross.sh).
      - run: >-
          SKIP_QEMU_TEST=skip SUDO=sudo TRACT_CROSS_BUILD_CLI=1 CARGO_TARGET_DIR=.cross-cache/target
          TRACT_CLI_FEATURES=onnx,tf,pulse,pulse-opl,transformers,extra,bench-suite
          PLATFORM=${{ matrix.triple }} ./ci/cross.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # ghcr login for the cross-build image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tract-cli-${{ matrix.triple }}-dinghy
          path: .cross-cache/target/${{ matrix.rustc_triple }}/release/tract

  bench-dinghy:
    name: bench ${{ matrix.device }}
    needs: [ prepare, build-dinghy ]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build-dinghy.result == 'success' || needs.prepare.outputs.bins_run != '') && needs.prepare.outputs.enabled == 'true' && vars.BENCH_DINGHY_ENABLED != 'false' && needs.prepare.outputs.dinghy == 'true' && needs.prepare.outputs.kind == 'native' && needs.prepare.outputs.dinghy_devices != '[]' }}
    # One sidekick runner per target (label per board), so boards bench in parallel.
    runs-on: ${{ matrix.runner }}
    # Bound the run so an offline/stuck target can't hang the PR report (which fans this in).
    timeout-minutes: 120
    # No concurrency group: one sidekick agent per device serialises its own work.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.dinghy_devices) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tract-cli-${{ matrix.triple }}-dinghy
          path: tract-cli
          run-id: ${{ needs.prepare.outputs.bins_run }}
          github-token: ${{ needs.prepare.outputs.bins_run && github.token || '' }}
      # A rebench only re-runs the boards its previous report flagged.
      - name: Bench on the dinghy target
        if: needs.prepare.outputs.rebench != 'true' || fromJSON(needs.prepare.outputs.only)[matrix.device]
        env:
          ONLY: ${{ fromJSON(needs.prepare.outputs.only)[matrix.device] }}
          SELECT: ${{ github.event.inputs.select }}
          DINGHY_TARGET: ${{ matrix.dinghy_target }}
          DEVICE: ${{ matrix.device }}
          TRIPLE: ${{ matrix.triple }}
          SAMPLES: ${{ needs.prepare.outputs.is_pr != 'true' && '--samples 5' || '' }}
          MT_LADDER: ${{ needs.prepare.outputs.mt_ladder }}
        run: |
          chmod +x tract-cli/tract
          mkdir -p result
          # dinghy otherwise copies the whole checkout to the board (source + every committed
          # test model), which overflows the small armv7 boards and fails the rsync deploy.
          # Scope the copy to just the bench manifest with a gitignore-style allowlist; the exe
          # is copied separately. Written into the ephemeral work folder, never committed: a
          # repo .dinghyignore would strip fixtures from everyone else's `cargo dinghy test`.
          printf '%s\n' '/*' '!/ci/' '/ci/*' '!/ci/benches.toml' > .dinghyignore
          # --cleanup also tears the deploy down afterwards. It must precede -d: after -d
          # consumes its value cargo-dinghy misparses a later -c and bails with -Zscript.
          if CARGO_PKG_NAME=tract cargo-dinghy --cleanup -d "$DINGHY_TARGET" runner \
               ./tract-cli/tract -- bench-suite \
               --manifest ci/benches.toml --skip-runtimes --no-cache --output - $SAMPLES \
               ${ONLY:+--only "$ONLY"} \
               ${SELECT:+--select "$SELECT"} \
               ${MT_LADDER:+--threads-ladder "$MT_LADDER"} \
               --base-url '${TRACT_BENCH_BASE_URL}' --cpu-governor '${TRACT_BENCH_CPU_GOVERNOR}' \
               >captured.out 2>captured.err
          then
            ok=true
          else
            ok=false
          fi
          grep '"metric"' captured.out > result/metrics || true
          grep '"failure"' captured.out > result/metrics.failures || rm -f result/metrics.failures
          if [ ! -s result/metrics ] && [ ! -f result/metrics.failures ]; then
            echo "::error::bench-dinghy: no metrics captured"
            exit 1
          fi
          printf '{"device":"%s","triple":"%s"}\n' "$DEVICE" "$TRIPLE" > result/meta.json
          if [ "$ok" != true ]; then
            echo "::error::bench-dinghy: some bench runs failed; the metrics of the others are kept"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('result/meta.json') != '' && (needs.prepare.outputs.rebench != 'true' || fromJSON(needs.prepare.outputs.only)[matrix.device]) }}
        with:
          name: bench-result-${{ matrix.device }}
          path: result

  # Nightly only: append the dinghy target's row to bench-data. The board can't run the append tool,
  # so a hosted job does it with the x86 CLI (bench-append is arch-agnostic JSON) reading the JSONL result.
  append-dinghy:
    needs: [ prepare, build, bench-dinghy ]
    # always() (like the report job) so a cancelled/failed device leg (e.g. one board that
    # timed out) still lets the boards that did finish append; each leg no-ops when its own
    # result artifact is absent.
    if: ${{ always() && needs.prepare.outputs.is_pr != 'true' && needs.prepare.outputs.enabled == 'true' && vars.BENCH_DINGHY_ENABLED != 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - device: cortex-a55
            triple: aarch64-unknown-linux-gnu-stretch
          - device: cortex-a53
            triple: aarch64-unknown-linux-gnu-stretch
          - device: cortex-a7
            triple: armv7-unknown-linux-gnueabihf-stretch
          - device: cortex-a9
            triple: armv7-unknown-linux-gnueabihf-stretch
          - device: beaglev-ahead
            triple: riscv64gc-unknown-linux-musl
          - device: orangepi-rv2
            triple: riscv64gc-unknown-linux-musl
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tract-cli-x86_64-unknown-linux-gnu
          path: tract-cli
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A leg whose bench never produced a result (timed out / failed) has no artifact;
        # tolerate that here and skip the append below rather than failing the whole job.
        continue-on-error: true
        with:
          name: bench-result-${{ matrix.device }}
          path: result
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # zizmor: ignore[artipacked] credentials are needed to push the row back to bench-data;
        # this checkout is never uploaded as an artifact.
        if: ${{ hashFiles('result/metrics') != '' }}
        with:
          ref: bench-data
          path: bench-data
          fetch-depth: 1
      - name: Append and push
        if: ${{ hashFiles('result/metrics') != '' }}
        env:
          DEVICE: ${{ matrix.device }}
          TRIPLE: ${{ matrix.triple }}
          REF: ${{ needs.prepare.outputs.ref }}
          DAY: ${{ needs.prepare.outputs.day }}
        run: |
          chmod +x tract-cli/tract
          tract-cli/tract bench-append --metrics result/metrics --out bench-data \
            --triple "$TRIPLE" --device "$DEVICE" --day "$DAY" --commit "$REF"
          cd bench-data
          git config user.name "tract-ci"
          git config user.email "tract-ci@users.noreply.github.com"
          git add -A
          git commit -m "bench: $DEVICE $DAY ${REF:0:9}"
          for i in 1 2 3 4 5; do
            git push origin HEAD:bench-data && exit 0
            git fetch origin bench-data
            git rebase origin/bench-data || git rebase --abort
          done
          echo "push failed after retries" >&2; exit 1

  report:
    name: Report bench to PR
    # After report-tests, so the two never edit the /ci command comment at once.
    needs: [ prepare, build, build-macos, bench, bench-macos, bench-dinghy, bench-wgpu, bench-wasm, report-tests ]
    # always() (not !cancelled()) so a cancelled/failed device leg still reports from the rest;
    # bench-report writes no file with nothing to compare, so a fully-cancelled run posts nothing.
    if: ${{ always() && needs.prepare.outputs.is_pr == 'true' && needs.prepare.outputs.enabled == 'true' && (needs.prepare.outputs.rebench != 'true' || needs.prepare.outputs.only != '{}') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write   # post the comment directly on same-repo PRs
      actions: read          # a rebench reads the previous report's state artifact
    outputs:
      summary: ${{ steps.head.outputs.superseded == 'true' && 'The PR head moved on' || steps.render.outputs.summary }}
    steps:
      # always() also lets a run cancelled by a newer push get here; its numbers are for a
      # head the PR has moved past, so it renders nothing and leaves the report to the new run.
      - id: head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          REF: ${{ needs.prepare.outputs.ref }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const superseded = pr.head.sha !== process.env.REF;
            if (superseded) {
              core.notice(`PR head is now ${pr.head.sha.slice(0, 9)}; not reporting on ${process.env.REF.slice(0, 9)}`);
            }
            core.setOutput('superseded', String(superseded));
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-result-*
          path: results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tract-cli-x86_64-unknown-linux-gnu
          path: tract-cli
          run-id: ${{ needs.prepare.outputs.bins_run }}
          github-token: ${{ needs.prepare.outputs.bins_run && github.token || '' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bench-data
          path: bench-data
          fetch-depth: 1
          persist-credentials: false
      # A rebench re-ran only the reds: fold its numbers into the previous report's results
      # (each metric keeps its best) so the comment covers the whole PR again.
      - name: Merge with the previous report
        if: steps.head.outputs.superseded != 'true' && needs.prepare.outputs.rebench == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
        run: |
          chmod +x tract-cli/tract
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREVIOUS/zip" > previous.zip
          unzip -q previous.zip -d previous
          tract-cli/tract bench-merge --previous previous/results --results results --out merged
          rm -rf results
          mv merged results
      # An mt-ladder run renders a self-contained thread-scaling table (speed + speedup
      # vs serial, no bench-data reference); a normal run renders the vs-main comparison.
      - name: Render comparison
        id: render
        if: steps.head.outputs.superseded != 'true'
        env:
          PR_SHA: ${{ needs.prepare.outputs.ref }}
          MT_LADDER: ${{ needs.prepare.outputs.mt_ladder }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          chmod +x tract-cli/tract
          if [ -n "$MT_LADDER" ]; then
            tract-cli/tract bench-mt-report --results results --pr-sha "$PR_SHA" --out pr-comment.md
            echo "summary=Thread-scaling report" >> "$GITHUB_OUTPUT"
          else
            tract-cli/tract bench-report --results results --bench-data bench-data \
              --thresholds ci/bench-thresholds.toml --pr-sha "$PR_SHA" --out pr-comment.md \
              --reds reds.json | tee render.log
            regressions=$(sed -n 's/.*regressions=\([0-9]*\).*/\1/p' render.log)
            failed=$(sed -n 's/.* failed=\([0-9]*\).*/\1/p' render.log)
            if [ -z "$regressions" ]; then
              summary="Nothing to compare"
            elif [ "$regressions" = 0 ]; then
              summary="No regressions"
            else
              summary="$regressions regression(s)"
            fi
            if [ -n "$failed" ] && [ "$failed" != 0 ]; then summary="$summary · $failed failed to run"; fi
            echo "summary=$summary" >> "$GITHUB_OUTPUT"
          fi
      - name: Name the boxes left out
        if: steps.head.outputs.superseded != 'true' && needs.prepare.outputs.unaffected != ''
        env:
          UNAFFECTED: ${{ needs.prepare.outputs.unaffected }}
          BENCH_NONE: ${{ needs.prepare.outputs.bench_none }}
        run: |
          note="Not benched, this change cannot affect them: $UNAFFECTED. \`/ci bench\` benches them anyway."
          if [ -f pr-comment.md ]; then
            printf '\n%s\n' "$note" >> pr-comment.md
          elif [ "$BENCH_NONE" = true ]; then
            printf '%s\n' "$note" > pr-comment.md
          fi
      # What a later `/ci rebench` on this head starts from: the per-device results, the
      # runs this report flagged red, and the run whose binaries they measured. A cancelled
      # run's partial report leaves none, so it never hides the last complete one.
      - name: Stage the rebench state
        if: ${{ !cancelled() && hashFiles('reds.json') != '' && needs.prepare.outputs.kind == 'native' }}
        env:
          BINS_RUN: ${{ needs.prepare.outputs.bins_run || github.run_id }}
        run: |
          mkdir -p bench-state
          cp -r results reds.json bench-state/
          echo "$BINS_RUN" > bench-state/bins-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ hashFiles('bench-state/reds.json') != '' }}
        with:
          name: bench-state-${{ needs.prepare.outputs.ref }}
          path: bench-state
          retention-days: 14
      # A `/ci` command gets the comparison, or why there is none, in the bench section of
      # its command comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event.inputs.comment_id != '' }}
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          path: .ci-scripts
          persist-credentials: false
      - id: cancelled
        if: ${{ cancelled() && github.event.inputs.comment_id != '' }}
        run: echo "cancelled=true" >> "$GITHUB_OUTPUT"
      - name: Report on the command comment
        if: ${{ github.event.inputs.comment_id != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_ID: ${{ github.event.inputs.comment_id }}
          SUPERSEDED: ${{ steps.head.outputs.superseded }}
          CANCELLED: ${{ steps.cancelled.outputs.cancelled }}
        with:
          script: |
            const fs = require('fs');
            const ci = require(`${process.env.GITHUB_WORKSPACE}/.ci-scripts/.github/scripts/ci-feedback.js`);
            let text;
            if (process.env.SUPERSEDED === 'true') {
              text = 'The PR head moved on since this run started, so its numbers are not reported.';
            } else if (fs.existsSync('pr-comment.md')) {
              text = fs.readFileSync('pr-comment.md', 'utf8').slice(0, 60000);
              if (process.env.CANCELLED === 'true') {
                text = `**Partial:** the run was cancelled, so only the bench legs that finished before it are compared.\n\n${text}`;
              }
            } else if (process.env.CANCELLED === 'true') {
              text = 'The run was cancelled before any bench leg had something to compare.';
            } else {
              text = 'Nothing to compare: no nightly reference for these runs yet, or every bench leg failed.';
            }
            await ci.update(github, context, { commentId: process.env.COMMENT_ID, sections: { bench: text } });
      # Only an automatic `pull_request` event on a fork gets a read-only token; every other
      # trigger (same-repo pull_request, or any workflow_dispatch — including /ci bench,
      # which always runs with a write token regardless of the target PR's fork status) can
      # post directly. A fresh comment per run (like the fork trampoline) so the PR thread
      # keeps the full history in chronological order instead of overwriting the previous result.
      - name: Comment on PR (direct)
        if: ${{ hashFiles('pr-comment.md') != '' && github.event.inputs.comment_id == '' && (github.event_name != 'pull_request' || needs.prepare.outputs.same_repo == 'true') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            const issue_number = parseInt(process.env.PR_NUMBER, 10);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number, body,
            });
      # Fork PRs on the automatic pull_request event get a read-only token and can't comment,
      # so hand the rendered comment + target PR to the bench-comment trampoline (workflow_run,
      # base context, write token) to post instead.
      - name: Stage comment for the trampoline (fork PRs)
        if: ${{ hashFiles('pr-comment.md') != '' && github.event_name == 'pull_request' && needs.prepare.outputs.same_repo != 'true' }}
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: |
          mkdir -p bench-comment
          mv pr-comment.md bench-comment/
          printf '%s\n' "$PR_NUMBER" > bench-comment/pr-number
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ hashFiles('bench-comment/pr-comment.md') != '' }}
        with:
          name: bench-comment
          path: bench-comment

  # The final state of a `/ci` command comment, once everything that reports on it is done:
  # report-tests and report wait for every test and bench job, and the run's job results
  # come from the API, so this needs no arrow from each of them.
  finish:
    name: Finish the /ci comment
    needs: [ prepare, report-tests, report ]
    if: ${{ always() && github.event.inputs.comment_id != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          path: .ci-scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_ID: ${{ github.event.inputs.comment_id }}
          REBENCH: ${{ github.event.inputs.rebench }}
          PREPARE: ${{ needs.prepare.result }}
          ONLY: ${{ needs.prepare.outputs.only }}
          SHA: ${{ needs.prepare.outputs.ref }}
          KIND: ${{ needs.prepare.outputs.kind }}
          ENABLED: ${{ needs.prepare.outputs.enabled }}
          SUMMARY: ${{ needs.report.outputs.summary }}
        with:
          script: |
            const ci = require(`${process.env.GITHUB_WORKSPACE}/.ci-scripts/.github/scripts/ci-feedback.js`);
            const result = await ci.runJobs(github, context);
            const sections = {};
            if (process.env.REBENCH === 'true' && process.env.PREPARE === 'failure') {
              sections.bench = 'No bench report on this head to rebench yet. If a bench is still running on it (a push starts one), wait for its report; otherwise run `/ci bench` first.';
            } else if (process.env.REBENCH === 'true' && process.env.ONLY === '{}') {
              sections.bench = 'The last bench report on this head has no reds; nothing to re-run.';
            }
            if (result.failed.length) {
              sections.failed = `Failed: ${result.failed.map(j => `\`${j}\``).join(', ')}.`;
            }
            await ci.update(github, context, { commentId: process.env.COMMENT_ID, state: result.state, sections });
            if (process.env.SHA && process.env.ENABLED === 'true') {
              let state = 'success';
              let description = process.env.SUMMARY || 'No bench report';
              if (process.env.REBENCH === 'true' && process.env.PREPARE === 'failure') {
                [state, description] = ['error', 'No bench report on this head to rebench yet'];
              } else if (process.env.REBENCH === 'true' && process.env.ONLY === '{}') {
                description = 'Nothing to re-run';
              } else if (result.state === 'cancelled') {
                [state, description] = ['cancelled', 'Cancelled'];
              }
              const target = process.env.KIND === 'native' ? 'bench' : `bench ${process.env.KIND}`;
              await ci.status(github, context, { sha: process.env.SHA, target, state, description });
            }

  # --- daily kernel-pick gate: fail if the dispatcher's matmul pick lags the fastest
  # available kernel for a shape by more than the tolerance. Reuses the bench binaries;
  # self-referential (picked vs best-in-pool), so no golden numbers to maintain. Nightly
  # only for now. Shares the per-box concurrency group so it never fights a running bench.
  hwbench:
    needs: [ prepare, build, build-macos ]
    if: ${{ needs.prepare.outputs.enabled == 'true' && needs.prepare.outputs.boxes != '[]' && github.event_name == 'schedule' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.boxes) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tract-cli-${{ matrix.triple }}
          path: tract-cli
      - name: Assert kernel picks
        run: |
          chmod +x tract-cli/tract
          tract-cli/tract hwbench --no-cache --no-memory --assert --tolerance 20

  # --- daily wasm kernel-pick gate. The wasm kernels and their packings are picked at
  # compile time on simd128 / relaxed-simd, so no native cohort exercises that half of
  # the dispatcher, and without either the pool is portable Rust alone. Build the CLI for
  # wasm32-wasip1 in each configuration on a hosted runner, then assert the picks under
  # wasmtime on the bench box. Self-referential (picked vs best in pool), so there is
  # nothing to keep in bench-data.
  build-wasm:
    needs: prepare
    if: ${{ needs.prepare.outputs.enabled == 'true' && (needs.prepare.outputs.is_pr != 'true' || needs.prepare.outputs.kind == 'wasm') && needs.prepare.outputs.mt_ladder == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: no-simd
            rustflags: ""
          - config: simd128
            rustflags: -C target-feature=+simd128
          - config: relaxed-simd
            rustflags: -C target-feature=+simd128,+relaxed-simd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm32-wasip1-${{ matrix.config }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # No cuda/metal; the model loaders are for bench-wasm.
      - env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          rustup target add wasm32-wasip1
          cargo build -p tract-cli --release --target wasm32-wasip1 --no-default-features \
            --features onnx,tf,tflite,pulse,pulse-opl,transformers,extra
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tract-wasm-${{ matrix.config }}
          path: target/wasm32-wasip1/release/tract.wasm

  hwbench-wasm:
    needs: [ prepare, build-wasm ]
    if: ${{ needs.prepare.outputs.enabled == 'true' && github.event_name == 'schedule' }}
    # The x86 bench box, not a hosted runner: the pick ratios are stable to ~2 points
    # there and swing by 2x when something else is compiling on the machine.
    runs-on: bench-i9-11900kb-rtx-4060
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [ no-simd, simd128, relaxed-simd ]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tract-wasm-${{ matrix.config }}
          path: tract-wasm
      # Pinned: a wasmtime bump changes Cranelift's codegen and can reorder the pool,
      # so it is a deliberate step, not whatever the box picked up last.
      - name: Setup wasmtime
        env:
          WASMTIME_VERSION: v48.0.0
        run: |
          curl --retry 5 --retry-delay 5 -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/$WASMTIME_VERSION/wasmtime-$WASMTIME_VERSION-x86_64-linux.tar.xz" | tar xJ
          echo "$PWD/wasmtime-$WASMTIME_VERSION-x86_64-linux" >> "$GITHUB_PATH"
      # The bandwidth probes are threaded and wasip1 has no threads, hence --no-cache
      # --no-memory: the matmul battery is the whole point here anyway. --include-generic
      # because autovectorised Rust is a real contender here, and the only pool at all
      # without simd128.
      - name: Report the whole battery
        run: |
          wasmtime run tract-wasm/tract.wasm hwbench --no-cache --no-memory --include-generic
      # Gated on the f32 shapes only. wasm has no real f16 kernel, so f16 runs on the
      # portable pool, where the dispatcher takes generic_f32_4x4 at 63-76% of
      # generic_f32_4x1 — a live mispick, reported by the step above but not gated until
      # it is fixed. Then this list goes away and the whole battery gates.
      - name: Assert kernel picks under wasmtime
        run: |
          wasmtime run tract-wasm/tract.wasm hwbench \
            512,512,120,f32 256,256,256,f32 192,288,1225,f32 64,64,64,f32 \
            --no-cache --no-memory --include-generic --assert --tolerance 20

  # --- nightly wasm model bench: the plain-CPU net suite, each bench a wasm32-wasip1
  # tract under wasmtime, appended to bench-data as its own device. Off the PR push path
  # so it costs the bench boxes no daytime minutes; on the 9900k, which carries no GPU
  # jobs. `/ci bench wasm` runs it alone on a PR, against that nightly series.
  bench-wasm:
    needs: [ prepare, build, build-wasm ]
    if: ${{ needs.prepare.outputs.enabled == 'true' && (needs.prepare.outputs.is_pr != 'true' || needs.prepare.outputs.kind == 'wasm') && needs.prepare.outputs.mt_ladder == '' }}
    runs-on: i99900k
    timeout-minutes: 90
    permissions:
      contents: write     # push to bench-data
    strategy:
      fail-fast: false
      matrix:
        config: [ simd128 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tract-cli-x86_64-unknown-linux-gnu
          path: tract-cli
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tract-wasm-${{ matrix.config }}
          path: tract-wasm
      # Same pin as hwbench-wasm: a wasmtime bump moves the numbers.
      - name: Setup wasmtime
        env:
          WASMTIME_VERSION: v48.0.0
        run: |
          curl --retry 5 --retry-delay 5 -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/$WASMTIME_VERSION/wasmtime-$WASMTIME_VERSION-x86_64-linux.tar.xz" | tar xJ
          echo "$PWD/wasmtime-$WASMTIME_VERSION-x86_64-linux" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.prepare.outputs.is_pr == 'true'
        with:
          ref: bench-data
          path: bench-ref
          fetch-depth: 1
          persist-credentials: false
      # Nightly: the median of 5 samples. PR: one run, retried against the nightly series
      # when it would show red, as on the native boxes.
      - name: Run bench suite
        env:
          DEVICE: i9-9900k_${{ matrix.config }}
          SELECT: ${{ github.event.inputs.select }}
        run: |
          chmod +x tract-cli/tract
          tract-cli/tract bench-suite --manifest ci/benches.toml \
            --wasm tract-wasm/tract.wasm \
            ${SELECT:+--select "$SELECT"} \
            ${{ needs.prepare.outputs.is_pr == 'true' && '--bench-data bench-ref --thresholds ci/bench-thresholds.toml --triple wasm32-wasip1 --device "$DEVICE"' || '--samples 5' }}
      - name: Checkout bench-data
        if: ${{ !cancelled() && hashFiles('metrics') != '' && needs.prepare.outputs.is_pr != 'true' }}
        # zizmor: ignore[artipacked] credentials are needed to push the row back to
        # bench-data; this checkout is never uploaded as an artifact.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bench-data
          path: bench-data
          fetch-depth: 1
      - name: Append and push
        if: ${{ !cancelled() && hashFiles('metrics') != '' && needs.prepare.outputs.is_pr != 'true' }}
        env:
          DEVICE: i9-9900k_${{ matrix.config }}
          REF: ${{ needs.prepare.outputs.ref }}
          DAY: ${{ needs.prepare.outputs.day }}
        run: |
          tract-cli/tract bench-append --metrics metrics --out bench-data \
            --triple wasm32-wasip1 --device "$DEVICE" --day "$DAY" --commit "$REF"
          cd bench-data
          git config user.name "tract-ci"
          git config user.email "tract-ci@users.noreply.github.com"
          git add -A
          git commit -m "bench: $DEVICE $DAY ${REF:0:9}"
          for i in 1 2 3 4 5; do
            git push origin HEAD:bench-data && exit 0
            git fetch origin bench-data
            git rebase origin/bench-data || git rebase --abort
          done
          echo "push failed after retries" >&2; exit 1
      - name: Stage PR result
        if: ${{ !cancelled() && hashFiles('metrics') != '' && needs.prepare.outputs.is_pr == 'true' }}
        env:
          DEVICE: i9-9900k_${{ matrix.config }}
        run: |
          mkdir -p result
          cp metrics result/metrics
          if [ -f metrics.failures ]; then cp metrics.failures result/; fi
          printf '{"device":"%s","triple":"wasm32-wasip1"}\n' "$DEVICE" > result/meta.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('metrics') != '' && needs.prepare.outputs.is_pr == 'true' }}
        with:
          name: bench-result-i9-9900k_${{ matrix.config }}
          path: result

  # --- daily load-and-run gate: every model in the bench manifest must load,
  # optimize and run once on each runtime the box offers (CPU + accelerator).
  # Reuses the bench binaries; no golden numbers, just exit status. Nightly only,
  # sharing the per-box concurrency group so it never fights a running bench.
  smoke:
    needs: [ prepare, build, build-macos ]
    if: ${{ needs.prepare.outputs.enabled == 'true' && needs.prepare.outputs.boxes != '[]' && github.event_name == 'schedule' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.boxes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tract-cli-${{ matrix.triple }}
          path: tract-cli
      - name: Load-and-run every bench model
        env:
          DEVICE: ${{ matrix.target }}
        run: |
          chmod +x tract-cli/tract
          tract-cli/tract bench-suite --smoke --manifest ci/benches.toml --device "$DEVICE" ${{ matrix.suite_args }}

  hwbench-dinghy:
    needs: [ prepare, build-dinghy ]
    if: ${{ needs.prepare.outputs.enabled == 'true' && vars.BENCH_DINGHY_ENABLED != 'false' && github.event_name == 'schedule' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: cortex-a55
            triple: aarch64-unknown-linux-gnu-stretch
            runner: dinghy-sidekick-a55
            dinghy_target: dinghy-a55
          - device: cortex-a53
            triple: aarch64-unknown-linux-gnu-stretch
            runner: dinghy-sidekick-a53
            dinghy_target: dinghy-a53
          - device: cortex-a7
            triple: armv7-unknown-linux-gnueabihf-stretch
            runner: dinghy-sidekick-a7
            dinghy_target: dinghy-a7
          - device: cortex-a9
            triple: armv7-unknown-linux-gnueabihf-stretch
            runner: dinghy-sidekick-a9
            dinghy_target: dinghy-a9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tract-cli-${{ matrix.triple }}-dinghy
          path: tract-cli
      - name: Assert kernel picks on the dinghy target
        env:
          DINGHY_TARGET: ${{ matrix.dinghy_target }}
        run: |
          chmod +x tract-cli/tract
          CARGO_PKG_NAME=tract cargo-dinghy -d "$DINGHY_TARGET" runner \
            ./tract-cli/tract -- hwbench --no-cache --no-memory --assert --tolerance 20 </dev/null
