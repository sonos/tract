name: Embedded targets

on:
  pull_request:
  schedule:
    - cron:  '0 5 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to test (from fork ok). Leave empty to run on selected branch."
        required: false
        type: number

env:
  CARGO_INCREMENTAL: false
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

permissions:
  contents: read

concurrency:
  # cancel superseded PR pushes (escape hatch); nightly keys on run_id so it never cancels
  group: cross-platform-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event.inputs.pr_number != '' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read   # list the PR's changed files
    outputs:
      test_ref: ${{ steps.set.outputs.test_ref }}
      linux: ${{ steps.scoped.outputs.linux }}
      apple: ${{ steps.scoped.outputs.apple }}
      windows: ${{ steps.scoped.outputs.windows }}
    steps:
      - id: set
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.info(`event: ${context.eventName}`);
            core.info(`payload.inputs: ${JSON.stringify(context.payload.inputs)}`);
            core.info(`payload.pull_request.number: ${context.payload.pull_request?.number}`);
            const prInput = context.payload.inputs?.pr_number ?? context.payload.pull_request?.number;
            core.info(`prInput: ${prInput} (type: ${typeof prInput})`);
            let ref;
            if (prInput) {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(prInput),
              });
              ref = pr.data.head.sha;
            } else {
              ref = process.env.GITHUB_SHA;
            }
            core.info(`test_ref: ${ref}`);
            core.setOutput('test_ref', ref);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.set.outputs.test_ref }}
          persist-credentials: false
      # On a PR push, ci/affected.py names the platforms this change cannot affect and they are
      # left out. The nightly, a dispatch, a `ci:full` label and CI_SCOPING=off run
      # everything, and so does any failure here.
      - id: changed
        if: github.event_name == 'pull_request' && vars.CI_SCOPING != 'off' && !contains(github.event.pull_request.labels.*.name, 'ci:full')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          # The files API lists at most 3000; past that, let everything run.
          if [ "$(wc -l < "$RUNNER_TEMP/changed.txt")" -ge 3000 ]; then echo Cargo.lock >> "$RUNNER_TEMP/changed.txt"; fi
          echo "files=$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT"
      - id: scope
        if: steps.changed.outputs.files != ''
        continue-on-error: true
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          python3 ci/affected.py --files "$FILES" --json "$RUNNER_TEMP/scope.json" --summary "$GITHUB_STEP_SUMMARY"
          echo "skip=$(jq -c '[.legs[] | select(.workflow == "cross-platform.yml" and (.affected | not)) | .leg]' "$RUNNER_TEMP/scope.json")" >> "$GITHUB_OUTPUT"
      - id: scoped
        env:
          SKIP: ${{ steps.scope.outputs.skip || '[]' }}
        run: |
          keep() { jq -c --arg job "$1" --argjson skip "$SKIP" 'map(select(("\($job) (\(.))") | IN($skip[]) | not))'; }
          linux=$(keep linux <<'EOF'
          [ "raspbian", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-gnu-stretch",
            "armv6vfp-unknown-linux-gnueabihf", "armv7-unknown-linux-gnueabihf",
            "armv7-unknown-linux-gnueabihf-stretch", "aarch64-unknown-linux-musl",
            "cortexa53-unknown-linux-musl", "armv7-unknown-linux-musl", "riscv64gc-unknown-linux-gnu",
            "rvv128-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi",
            "i686-linux-android", "x86_64-linux-android", "x86_64-unknown-linux-gnu-stretch",
            "wasm32-unknown-unknown", "wasm32-wasi", "wasm32-unknown-emscripten" ]
          EOF
          )
          apple=$(keep apple <<<'[ "aarch64-apple-ios", "aarch64-apple-darwin" ]')
          windows=$(jq -r --argjson skip "$SKIP" -n '"windows-arm64" | IN($skip[]) | not')
          jq -r '.[] | "::notice::not run, this change cannot affect it: \(.)"' <<<"$SKIP"
          {
            echo "linux=$linux"
            echo "apple=$apple"
            echo "windows=$windows"
          } >> "$GITHUB_OUTPUT"

  windows-arm64:
    needs: prepare
    if: needs.prepare.outputs.windows == 'true'
    runs-on: windows-11-vs2026-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.prepare.outputs.test_ref }}
        fetch-depth: 0
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
    - name: Check tract-linalg
      run: cargo check -p tract-linalg

  linux:
    needs: prepare
    if: needs.prepare.outputs.linux != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.linux) }}

    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      packages: read      # pull the prebuilt cross-build image (ghcr, private)

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.prepare.outputs.test_ref }}
        fetch-depth: 0
        persist-credentials: false

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ matrix.platform }}
        # only main saves; PR runs restore without evicting main's caches.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Setup wasmtime
      if: matrix.platform == 'wasm32-wasi'
      uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3

    - name: Cross script
      env:
        PLATFORM: ${{matrix.platform}}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # ghcr login for the cross-build image
      run: |
        ci/cross.sh

  apple:
    needs: prepare
    if: needs.prepare.outputs.apple != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.apple) }}

    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.prepare.outputs.test_ref }}
        fetch-depth: 0
        persist-credentials: false

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ matrix.platform }}
        # only main saves; PR runs restore without evicting main's caches.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Cross script
      env:
        PLATFORM: ${{matrix.platform}}
      run: |
        ci/cross.sh
