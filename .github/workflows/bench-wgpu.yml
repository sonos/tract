name: wgpu bench

# Nightly wgpu bench on entangled (the 4060 box), over Vulkan: ci/benches-wgpu.toml on the wgpu
# runtime, appended to bench-data as device i9-11900kb_rtx-4060_wgpu. Scheduled at 01:00 UTC,
# in the box's idle window before the 03:00 examples and the 04:00 CLI nightly.

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The kill switches of the CLI bench: BENCH_ENABLED, and the box listed in
    # BENCH_DISABLED_BOXES.
    if: ${{ vars.BENCH_ENABLED != 'false' && !contains(format(' {0} ', vars.BENCH_DISABLED_BOXES), ' i9-11900kb_rtx-4060 ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-gnu-wgpu
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ROOT=. ./ci/ci-system-setup.sh && cargo build -p tract-cli --release --features bench-suite,wgpu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tract-cli-wgpu
          path: target/release/tract

  bench:
    needs: build
    runs-on: bench-i9-11900kb-rtx-4060
    timeout-minutes: 120
    permissions:
      contents: write     # push to bench-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tract-cli-wgpu
          path: tract-cli
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bench-data
          path: bench-ref
          fetch-depth: 1
          persist-credentials: false
      - name: Check the Vulkan adapter is the NVIDIA GPU
        # Without the NVIDIA ICD, wgpu would settle for a CPU implementation (lavapipe)
        # and the series would silently record CPU numbers.
        run: vulkaninfo --summary | grep -q "driverName *= NVIDIA"
      - name: Run bench suite
        run: |
          chmod +x tract-cli/tract
          tract-cli/tract bench-suite \
            --manifest ci/benches-wgpu.toml \
            --bench-data bench-ref \
            --thresholds ci/bench-thresholds.toml \
            --triple x86_64-unknown-linux-gnu --device i9-11900kb_rtx-4060_wgpu \
            --samples 5 --second-pass-max 10        # produces ./metrics
      - name: Checkout bench-data
        # A failed bench run fails the suite after it wrote the others' metrics; record those.
        if: ${{ !cancelled() && hashFiles('metrics') != '' }}
        # zizmor: ignore[artipacked] credentials are needed to push the row back to
        # bench-data; this checkout is never uploaded as an artifact.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bench-data
          path: bench-data
          fetch-depth: 1
      - name: Append and push
        if: ${{ !cancelled() && hashFiles('metrics') != '' }}
        env:
          DEVICE: i9-11900kb_rtx-4060_wgpu
          REF: ${{ github.sha }}
        run: |
          DAY=$(date -u +%F)
          tract-cli/tract bench-append --metrics metrics --out bench-data \
            --triple x86_64-unknown-linux-gnu --device "$DEVICE" --day "$DAY" --commit "$REF"
          cd bench-data
          git config user.name "tract-ci"
          git config user.email "tract-ci@users.noreply.github.com"
          git add -A
          git commit -m "bench: $DEVICE $DAY ${REF:0:9}"
          for i in 1 2 3 4 5; do
            git push origin HEAD:bench-data && exit 0
            git fetch origin bench-data
            git rebase origin/bench-data || git rebase --abort
          done
          echo "push failed after retries" >&2; exit 1
