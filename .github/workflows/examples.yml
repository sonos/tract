name: Examples

on:
  schedule:
    - cron:  '0 3 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to test (from fork ok). Leave empty to run on selected branch."
        required: false
        type: number
      comment_id:
        description: "The /ci command comment to report on (set by ci-command.yml)."
        required: false
        type: string

env:
  CARGO_INCREMENTAL: false
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    outputs:
      test_ref: ${{ steps.set.outputs.test_ref }}
      pr_number: ${{ steps.set.outputs.pr_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          path: .ci-scripts
          persist-credentials: false
      - id: set
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ci = require(`${process.env.GITHUB_WORKSPACE}/.ci-scripts/.github/scripts/ci-feedback.js`);
            const prInput = context.payload.inputs?.pr_number;
            core.setOutput('pr_number', prInput ? String(prInput) : '');
            if (!prInput) {
              core.setOutput('test_ref', process.env.GITHUB_SHA);
              return;
            }
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(prInput),
            });
            const sha = pr.data.head.sha;
            core.setOutput('test_ref', sha);
            await ci.status(github, context, { sha, target: 'examples', state: 'pending', description: 'Running' });
            await ci.update(github, context, { commentId: context.payload.inputs?.comment_id, state: 'running' });

  examples:
    runs-on: ubuntu-24.04
    needs: prepare
    outputs:
      examples: ${{steps.set-matrix.outputs.examples}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.test_ref }}
          persist-credentials: false
      - id: set-matrix
        run: |
          echo examples=`find examples -name ci.sh | cut -d/ -f 2 | jq -Rsc '. / "\n" - [""]'` >> "$GITHUB_OUTPUT"

  example:
    name: ${{ matrix.ex }}
    runs-on: ubuntu-24.04
    needs: [ prepare, examples ]
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ex: ${{fromJSON(needs.examples.outputs.examples)}}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.prepare.outputs.test_ref }}
        persist-credentials: false

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: false # restore-only: schedule/dispatch job, never save (would evict the per-PR caches under the 10 GB cap)

    - name: CPU features
      run: ci/cpu-features.sh

    - name: example tests
      env:
        MATRIX_EX: ${{matrix.ex}}
      timeout-minutes: 30
      run: |
        cd examples/${MATRIX_EX}
        ./ci.sh

  web-demos:
    runs-on: ubuntu-24.04
    needs: prepare
    outputs:
      demos: ${{steps.set-matrix.outputs.demos}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.test_ref }}
          persist-credentials: false
      - id: set-matrix
        run: |
          echo demos=`find examples -path '*/web/build.sh' | cut -d/ -f 2 | jq -Rsc '. / "\n" - [""]'` >> "$GITHUB_OUTPUT"

  web-demo:
    name: ${{ matrix.demo }} (web)
    runs-on: ubuntu-24.04
    needs: [ prepare, web-demos ]
    strategy:
      fail-fast: false
      matrix:
        demo: ${{fromJSON(needs.web-demos.outputs.demos)}}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.prepare.outputs.test_ref }}
        persist-credentials: false

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: false # restore-only: schedule/dispatch job, never save (would evict the per-PR caches under the 10 GB cap)

    - name: wasm32 target and the wasm-bindgen CLI Cargo.lock pins
      run: |
        rustup target add wasm32-unknown-unknown
        version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
        cargo install wasm-bindgen-cli --version "$version" --locked

    - name: build the site
      env:
        DEMO: ${{ matrix.demo }}
      timeout-minutes: 30
      run: examples/"$DEMO"/web/build.sh

  build-tract-cli:
    runs-on: ubuntu-24.04
    needs: prepare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.test_ref }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false # restore-only: schedule/dispatch job, never save (would evict the per-PR caches under the 10 GB cap)
      - run: cargo build -p tract-cli --profile opt-no-lto
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tract-cli-x86_64
          path: ./target/opt-no-lto/tract

  build-tract-cli-macos:
    runs-on: bench-apple-m1-max
    needs: prepare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.test_ref }}
          persist-credentials: false
      - run: cargo build -p tract-cli --profile opt-no-lto
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tract-cli-aarch64-apple
          path: ./target/opt-no-lto/tract

  gpu-examples:
    runs-on: ubuntu-24.04
    needs: prepare
    outputs:
      examples: ${{steps.set-matrix.outputs.examples}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.test_ref }}
          persist-credentials: false
      - id: set-matrix
        run: |
          echo examples=`find examples -name ci-gpu.sh | cut -d/ -f 2 | jq -Rsc '. / "\n" - [""]'` >> "$GITHUB_OUTPUT"

  gpu-example:
    name: ${{ matrix.ex }} (CUDA)
    runs-on: bench-i9-11900kb-rtx-4060
    needs: [prepare, gpu-examples, build-tract-cli]
    strategy:
      fail-fast: false
      matrix:
        ex: ${{fromJSON(needs.gpu-examples.outputs.examples)}}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.prepare.outputs.test_ref }}
        persist-credentials: false

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: tract-cli-x86_64
        path: target/opt-no-lto

    - run: chmod +x target/opt-no-lto/tract

    - name: GPU example tests
      timeout-minutes: 60
      env:
        EX: ${{ matrix.ex }}
      run: |
        cd "examples/$EX"
        ./ci-gpu.sh

  gpu-example-metal:
    name: ${{ matrix.ex }} (Metal)
    runs-on: bench-apple-m1-max
    needs: [prepare, gpu-examples, build-tract-cli-macos]
    strategy:
      fail-fast: false
      matrix:
        ex: ${{fromJSON(needs.gpu-examples.outputs.examples)}}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.prepare.outputs.test_ref }}
        persist-credentials: false

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: tract-cli-aarch64-apple
        path: target/opt-no-lto

    - run: chmod +x target/opt-no-lto/tract

    - name: Metal GPU example tests
      timeout-minutes: 60
      run: |
        cd examples/${MATRIX_EX}
        ./ci-gpu.sh
      env:
        MATRIX_EX: ${{matrix.ex}}

  report:
    name: Report result to PR
    needs: [ prepare, examples, example, web-demos, web-demo, build-tract-cli, build-tract-cli-macos, gpu-examples, gpu-example, gpu-example-metal ]
    if: ${{ always() && needs.prepare.outputs.pr_number != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          path: .ci-scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          HEAD_SHA: ${{ needs.prepare.outputs.test_ref }}
          COMMENT_ID: ${{ github.event.inputs.comment_id }}
        with:
          script: |
            const ci = require(`${process.env.GITHUB_WORKSPACE}/.ci-scripts/.github/scripts/ci-feedback.js`);
            const sha = process.env.HEAD_SHA;
            const result = ci.jobs(process.env.NEEDS);
            await ci.status(github, context, {
              sha, target: 'examples', state: result.state,
              description: { success: 'All jobs passed', cancelled: 'Cancelled' }[result.state] || `${result.failed.length} job(s) failed`,
            });
            await ci.update(github, context, {
              commentId: process.env.COMMENT_ID,
              issueNumber: process.env.PR_NUMBER,
              fallbackHeader: `**Examples** · head \`${sha.slice(0, 9)}\``,
              state: result.state,
              sections: { tests: result.text },
            });
