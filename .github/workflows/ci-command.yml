name: CI slash command

# Lets maintainers trigger heavy CI on a PR by commenting:
#   /ci full           -> Full test harness        (full.yml)
#   /ci cli            -> CLI: harness cases incl. ci-full.sh, LLMs, bench (cli.yml)
#   /ci large-models   -> alias of cli
#   /ci large          -> alias of cli
#   /ci llm            -> alias of cli
#   /ci wheels         -> Python wheels            (wheels.yml)
#   /ci python         -> alias of wheels
#   /ci py             -> alias of wheels
#   /ci examples       -> Examples                 (examples.yml)
#   /ci ex             -> alias of examples
#   /ci blackwell [tests|bench|both] -> RTX 5090 / SM120 (cuda-blackwell.yml);
#                         mode defaults to tests. Operator-only, see below.
#   /ci 5090           -> alias of blackwell
#   /ci bench          -> cli.yml's PR bench alone (the push already ran the harness ci.sh cases)
#   /ci bench all      -> the PR bench of every bench, nightly-only ones included
#   /ci bench wgpu     -> the wgpu bench alone (4060 box, Vulkan) vs its nightly reference
#   /ci bench wasm     -> the wasm bench alone (9900k, wasmtime) vs its nightly reference
#   /ci bench PATTERNS -> /ci bench restricted to the benches whose name matches one of the
#                         comma-separated globs (`*ppocr*`), nightly-only ones included
#   /ci bench wgpu PATTERNS, /ci bench wasm PATTERNS -> that leg alone, restricted the same way
#   /ci benches        -> alias of bench
#   /ci rebench        -> re-run only the reds of the last bench report on the PR head,
#                         on the boxes that flagged them, and report the merged result
#   /ci bench-mt-ladder [ladder] -> a thread-scaling bench alone; ladder defaults to 2,4,0
# Only commenters with write access can trigger (enforced by slash-command-dispatch).
# `blackwell` is narrower still: it runs on a single workstation GPU, so only the
# logins in the BLACKWELL_OPERATORS repo variable (default `kali`) can queue it.
#
# Feedback: the command gets 👀/🚀 reactions, then one comment saying what was
# scheduled. The dispatched workflow edits that comment (running, then done or failed,
# with a tests and/or bench section) through .github/scripts/ci-feedback.js, and a run
# that tests something also sets a `/ci <target>` commit status on the PR head.

# Hardened: the comment job checks out nothing and runs no PR code; it only hands the
# comment to slash-command-dispatch, which drops commenters without write access. The
# dispatched route job checks out the default branch and reads the command as data.
on:  # zizmor: ignore[dangerous-triggers]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [ci-command]

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch /ci comment
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request }}
    runs-on: ubuntu-24.04
    # The 👀/🚀 reactions on the /ci comment are set with this job's GITHUB_TOKEN.
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Slash command dispatch
        uses: peter-evans/slash-command-dispatch@9bdcd7914ec1b75590b790b844aa3b8eee7c683a # v5.0.2
        with:
          token: ${{ secrets.CI_DISPATCH_TOKEN }}
          commands: ci
          permission: write
          issue-type: pull-request

  # Two steps so each token does one thing: the Actions bot (GITHUB_TOKEN) posts the
  # command comment the dispatched workflow then edits, and CI_DISPATCH_TOKEN dispatches
  # (a GITHUB_TOKEN dispatch would not start the workflow).
  route:
    name: Route /ci target
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Parse the command and post its comment
        id: parse
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BLACKWELL_OPERATORS: ${{ vars.BLACKWELL_OPERATORS }}
        with:
          script: |
            const ci = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-feedback.js`);
            const cp = context.payload.client_payload;
            const args = cp.slash_command.args.unnamed;
            const target = (args.arg1 || '').toLowerCase();
            const pr = cp.pull_request.number;
            const who = cp.github?.payload?.comment?.user?.login || '';
            const reject = async msg => {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, body: msg,
              });
              core.setFailed(msg);
            };
            const map = {
              'full': 'full.yml',
              'cli': 'cli.yml',
              'large-models': 'cli.yml',
              'large': 'cli.yml',
              'llm': 'cli.yml',
              'wheels': 'wheels.yml',
              'python': 'wheels.yml',
              'py': 'wheels.yml',
              'examples': 'examples.yml',
              'ex': 'examples.yml',
              'blackwell': 'cuda-blackwell.yml',
              '5090': 'cuda-blackwell.yml',
              'bench': 'cli.yml',
              'benches': 'cli.yml',
              'bench-mt-ladder': 'cli.yml',
              'rebench': 'cli.yml',
            };
            const workflow = map[target];
            if (!workflow) {
              return reject([
                `Unknown \`/ci\` target: \`${target || '(none)'}\`.`,
                '',
                'Usage: `/ci full`, `/ci cli` (aliases: `large-models`, `large`, `llm`), `/ci bench [all|PATTERNS|wgpu [PATTERNS]|wasm [PATTERNS]]` (alias: `benches`; `all` adds the nightly-only benches; PATTERNS: comma-separated bench-name globs like `*ppocr*`), `/ci rebench`, `/ci wheels` (aliases: `python`, `py`), `/ci examples` (alias: `ex`), `/ci blackwell [tests|bench|both]` (alias: `5090`), or `/ci bench-mt-ladder [ladder]` (default ladder `2,4,0`).',
              ].join('\n'));
            }
            const inputs = { pr_number: String(pr) };
            let plan;

            if (workflow === 'full.yml') {
              plan = 'Full test harness (`full.yml`). Check: `/ci full`.';
            }
            if (workflow === 'examples.yml') {
              plan = 'Examples (`examples.yml`). Check: `/ci examples`.';
            }
            if (workflow === 'wheels.yml') {
              plan = 'Python wheels and sdist (`wheels.yml`). Check: `/ci wheels`.';
            }
            if (['cli', 'large-models', 'large', 'llm'].includes(target)) {
              plan = 'CLI workflow, full scope (`cli.yml`): harness `ci.sh` and `ci-full.sh` cases, the LLM matrix, harness-checked, and the PR bench. Check: `/ci cli` (tests).';
            }

            // `/ci blackwell [tests|bench|both]`. Write access to the repo is not
            // consent to take someone's workstation GPU: the Blackwell box has one
            // operator, who is also the person deciding when its runner is up at all.
            if (workflow === 'cuda-blackwell.yml') {
              const operators = (process.env.BLACKWELL_OPERATORS || 'kali')
                .split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
              if (!operators.includes(who.toLowerCase())) {
                return reject(`\`/ci ${target}\` runs on a single workstation GPU and is reserved to its operator (${operators.map(o => '@' + o).join(', ')}). Ask for a run rather than queueing one.`);
              }
              // bench A/Bs the head against its merge-base on the box instead of
              // running the CUDA suites.
              const mode = (args.arg2 || 'tests').toLowerCase();
              if (!['tests', 'bench', 'both'].includes(mode)) {
                return reject(`Unknown \`/ci ${target}\` mode: \`${mode}\`. Use \`tests\`, \`bench\` or \`both\`.`);
              }
              inputs.mode = mode;
              plan = {
                tests: 'CUDA suites on the RTX 5090 (`cuda-blackwell.yml`). Check: `/ci blackwell`.',
                bench: 'Bench of the head against its merge-base on the RTX 5090 (`cuda-blackwell.yml`).',
                both: 'CUDA suites, then a bench of the head against its merge-base, on the RTX 5090 (`cuda-blackwell.yml`). Check: `/ci blackwell` (tests).',
              }[mode] + ' Waits in the queue until the box\'s runner is up.';
            }
            // `/ci bench` is the PR-push bench; `/ci bench all` adds the nightly-only benches;
            // `/ci bench wgpu` and `/ci bench wasm` run that one bench leg and nothing else;
            // any other argument is a list of bench-name globs passed on as `select`.
            if (target === 'bench' || target === 'benches') {
              const arg = (args.arg2 || '').toLowerCase();
              const extra = (args.arg3 || '').toLowerCase();
              const scopes = { '': 'bench', all: 'bench', wgpu: 'wgpu', wasm: 'wasm' };
              const isPatterns = a => /^[a-z0-9_.*-]+(,[a-z0-9_.*-]+)*$/.test(a);
              const usage = `Use \`/ci ${target}\`, \`/ci ${target} all\`, \`/ci ${target} PATTERNS\`, \`/ci ${target} wgpu [PATTERNS]\` or \`/ci ${target} wasm [PATTERNS]\` (PATTERNS: comma-separated bench-name globs like \`*ppocr*\`).`;
              let patterns = '';
              if (Object.hasOwn(scopes, arg) && (!extra || (['wgpu', 'wasm'].includes(arg) && isPatterns(extra)))) {
                inputs.scope = scopes[arg];
                patterns = arg === 'all' ? '*' : extra;
              } else if (isPatterns(arg) && !extra) {
                inputs.scope = 'bench';
                patterns = arg;
              } else {
                return reject(`Unknown \`/ci ${target}\` arguments: \`${[arg, extra].filter(Boolean).join(' ')}\`. ${usage}`);
              }
              if (patterns) {
                // Each pattern must name a bench of the PR head's manifest for that leg, so a
                // typo is answered here rather than by a run whose every bench leg fails.
                const manifestPath = inputs.scope === 'wgpu' ? 'ci/benches-wgpu.toml' : 'ci/benches.toml';
                let names = [];
                try {
                  const { data } = await github.rest.repos.getContent({
                    owner: context.repo.owner, repo: context.repo.repo,
                    path: manifestPath, ref: cp.pull_request.head.sha,
                  });
                  const manifest = Buffer.from(data.content, 'base64').toString('utf8');
                  names = [...new Set([...manifest.matchAll(/^name\s*=\s*"([^"]+)"/gm)].map(m => m[1]))];
                } catch (e) {
                  core.warning(`could not read ${manifestPath} at the PR head, patterns not checked: ${e.message}`);
                }
                const glob = p => new RegExp(`^${p.split('*').map(s => s.replace(/[.\-]/g, '\\$&')).join('.*')}$`, 'i');
                const unmatched = names.length ? patterns.split(',').filter(p => !names.some(n => glob(p).test(n))) : [];
                if (unmatched.length) {
                  return reject([
                    `\`/ci ${target}\`: ${unmatched.map(p => `\`${p}\``).join(', ')} ${unmatched.length > 1 ? 'match' : 'matches'} no bench in ${manifestPath}. A pattern is a bench-name glob, \`*\` matching any run of characters (\`*ppocr*\`); without \`*\` it must be a whole name.`,
                    '',
                    `<details><summary>Benches in ${manifestPath}</summary>\n\n${names.map(n => `\`${n}\``).join(', ')}\n\n</details>`,
                  ].join('\n'));
                }
                inputs.select = patterns;
              }
              plan = {
                bench: 'PR bench on the bench boxes and dev boards (`cli.yml`); no tests, the push already ran them (`/ci cli` does).',
                wgpu: 'The wgpu bench leg alone (4060 box, Vulkan) against its nightly reference (`cli.yml`).',
                wasm: 'The wasm bench leg alone (9900k, wasmtime) against its nightly reference (`cli.yml`).',
              }[inputs.scope];
              if (inputs.select === '*') {
                plan = 'PR bench of every bench, nightly-only ones included, on the bench boxes and dev boards (`cli.yml`).';
              } else if (inputs.select) {
                plan = {
                  bench: `PR bench of the benches matching \`${inputs.select}\` (nightly-only ones included) on the bench boxes and dev boards (\`cli.yml\`).`,
                  wgpu: `The wgpu bench leg alone (4060 box, Vulkan), for the benches matching \`${inputs.select}\`, against its nightly reference (\`cli.yml\`).`,
                  wasm: `The wasm bench leg alone (9900k, wasmtime), for the benches matching \`${inputs.select}\`, against its nightly reference (\`cli.yml\`).`,
                }[inputs.scope];
              }
            }
            if (target === 'rebench') {
              inputs.scope = 'bench';
              inputs.rebench = 'true';
              plan = 'Re-run the reds of the last bench report on this head, on the boxes that flagged them, and merge them into that report (`cli.yml`).';
            }
            // `/ci bench-mt-ladder [ladder]`: pass the optional ladder (default 2,4,0) so
            // cli.yml runs the thread scaling sweep + scaling report instead of vs-main.
            if (target === 'bench-mt-ladder') {
              inputs.scope = 'bench';
              inputs.mt_ladder = args.arg2 || '2,4,0';
              plan = `Thread-scaling bench on ladder \`${inputs.mt_ladder}\` instead of the PR bench (\`cli.yml\`).`;
            }

            const command = ['/ci', args.arg1, args.arg2, args.arg3].filter(Boolean).join(' ');
            const header = `**\`${command}\`** · requested by @${who} · head \`${(cp.pull_request.head?.sha || '').slice(0, 9)}\``;
            const id = await ci.create(github, context, pr, { header, sections: [['plan', plan]] });
            inputs.comment_id = String(id);
            core.setOutput('workflow', workflow);
            core.setOutput('inputs', JSON.stringify(inputs));
      - name: Dispatch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKFLOW: ${{ steps.parse.outputs.workflow }}
          INPUTS: ${{ steps.parse.outputs.inputs }}
        with:
          github-token: ${{ secrets.CI_DISPATCH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: process.env.WORKFLOW,
              ref: context.payload.repository.default_branch,
              inputs: JSON.parse(process.env.INPUTS),
            });
            core.info(`Dispatched ${process.env.WORKFLOW}`);
      - name: Report a failed dispatch on the command comment
        if: ${{ failure() && steps.parse.outputs.inputs != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUTS: ${{ steps.parse.outputs.inputs }}
        with:
          script: |
            const ci = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-feedback.js`);
            await ci.update(github, context, {
              commentId: JSON.parse(process.env.INPUTS).comment_id,
              state: 'failure',
              sections: { dispatch: 'The workflow could not be dispatched; see the run log.' },
            });
