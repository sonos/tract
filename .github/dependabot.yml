version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      rust-dependencies:
        patterns:
          - "*"
    ignore:
      # The workspace range allows 0.13 so downstream can dedup, but 0.13 needs
      # rustc 1.95 (MSRV is 1.91) and wgpu 30 still pins 0.12. Lift this when
      # MSRV >= 1.95 and wgpu has moved.
      - dependency-name: "parking_lot"
        versions: [">=0.13"]
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/api/py"
    ignore:
      # Only update them manually since updating them might break compatibility
      - dependency-name: "numpy"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
