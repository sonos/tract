[package]
name = "tract-libcli"
version = "0.23.8-pre"
license = "MIT OR Apache-2.0"
authors = ["Mathieu Poumeyrol <kali@zoy.org>"]
description = "Tiny, no-nonsense, self contained, TensorFlow and ONNX inference"
repository = "https://github.com/sonos/tract"
keywords = ["TensorFlow", "NeuralNetworks"]
categories = ["science"]
edition = "2024"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
box_drawing.workspace = true
clap.workspace = true
colorous.workspace = true
lazy_static.workspace = true
log.workspace = true
ndarray-npy.workspace = true
nu-ansi-term.workspace = true
py_literal.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tract-core.workspace = true
tract-hir.workspace = true
tract-onnx = { workspace = true, optional = true }
tract-transformers = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
tract-metal = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
cudarc = { workspace = true, optional = true }
tract-cuda = { workspace = true, optional = true }

[features]
default = ["transformers"]
# hir = ["tract-hir"]
hir = []
onnx = ["tract-onnx"]
complex = ["tract-core/complex"]
transformers = ["tract-transformers"]
# Dependency selector for the Metal-backed `--metal-gpu-trace` path, mirroring
# `cuda`. Off leaves the flag reporting that the build has no Metal support,
# and keeps tract-metal -- and the shader sources it embeds -- out of any
# library linking tract-libcli.
metal = ["dep:tract-metal"]

# Marker / dependency selector for cudarc-backed code paths
# (`--cuda-gpu-trace`).  Enabled transitively by tract-cli's cuda-XXXXX
# features.  Always pulled together — picking one selects the cudarc API
# binding; this feature wires the optional dep in.
cuda = ["dep:cudarc", "dep:tract-cuda"]
