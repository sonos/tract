# Bench manifest for the nightly wgpu bench (bench-wgpu.yml, on the cuda-lovelace box over
# Vulkan). Same models and args as benches.toml, each run on the wgpu runtime only; a bench
# that benches.toml runs on the CPU under a variant keeps that variant in its name, since
# every run here is labelled `wgpu`. Ops wgpu does not cover run on the CPU (hybrid fallback).
# Left out until they run on wgpu: the LLM benches (a dispatch binds one storage buffer both
# read-only and read-write) and trunet pulse1_f16 (f16 matmuls on the f32 blocked kernels).

base_url = "https://tract-test-assets.tract.rs"

[[bench]]
kind = "net"
name = "arm_ml_kws_cnn_m_pass"
model = "ARM-ML-KWS-CNN-M.pb"
args = "-i 49,10,f32 --partial --input-node Mfcc"
runtimes = ["wgpu"]

