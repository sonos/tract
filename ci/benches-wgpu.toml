[[bench]]
kind = "net"
name = "nemotron-3_5-asr-streaming-0_6b-f32f32-preprocessor_pulse100ms"
model = "asr/634/nvidia--nemotron-3.5-asr-streaming-0.6b-f32f32/nvidia--nemotron-3.5-asr-streaming-0.6b-f32f32.preprocessor.nnef.tgz"
args = [
    "--nnef-tract-transformers",
    "-t",
    "transformers_detect_all",
    "-t",
    "set_symbols(values: {\"BATCH\": 1})",
    "-t",
    "patch(body: \"length = tract_core_shape_of(input_signal)[1];\")",
    "-t",
    "select_inputs(inputs: [\"input_signal\"])",
    "-t",
    "select_outputs(outputs: [\"processed_signal\"])",
    "-t",
    "pulse(symbol: Some(\"INPUT_SIGNAL__TIME\"), pulse: \"1600\")",
]
runtimes = ["wgpu"]

[[bench]]
